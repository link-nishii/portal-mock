let pmRules=[['login','ログイン',2,40,true],['read_announcement','お知らせ閲覧',2,20,true],['post','コミュニティに投稿',5,50,true],['reaction','リアクション',2,20,true],['profile_complete','プロフィール入力',5,5,false],['birthday','誕生日',100,100,true],['company_anniversary','会社設立記念日',500,500,false]];
const pmEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pmFmt=n=>Number(n).toLocaleString('ja-JP');
const pmBtn=(label,fn,primary=false)=>`<button class="pm-btn ${primary?'primary':''}" onclick="${fn}">${label}</button>`;
function pmPoints(){return `<div class="pm-wrap"><div class="pm-top"><div class="pm-summary" style="margin:0"><div class="pm-stat"><small>現在の保有ポイント</small><strong class="pm-accent">${pmFmt(pmBalance)} <span style="font-size:14px">pt</span></strong></div><div class="pm-stat"><small>今月の獲得</small><strong>+240 <span style="font-size:14px">pt</span></strong></div><div class="pm-stat"><small>今月の利用</small><strong>500 <span style="font-size:14px">pt</span></strong></div></div><div class="pm-actions">${pmBtn('ポイントを贈る',"pmGiftModal()")}${pmBtn('景品を探す',"pmPointTab='gifts';render()",true)}</div></div><section class="pm-surface"><div class="pm-h"><div class="pm-segment">${(pmPointTab==='gifts'?[['history','← 履歴へ戻る']]:[['history','ポイント履歴'],['redeems','交換申請']]).map(([v,t])=>`<button class="${pmPointTab===v?'on':''}" onclick="pmPointTab='${v}';render()">${t}</button>`).join('')}</div>${pmPointTab==='history'?`<select class="pm-select" onchange="pmPointFilter=this.value;render()">${[['all','すべて'],['auto','自動付与'],['manual','手動付与'],['redeem','景品交換'],['present','プレゼント']].map(([v,t])=>`<option value="${v}" ${pmPointFilter===v?'selected':''}>${t}</option>`).join('')}</select>`:''}</div>${pmPointTab==='history'?`<div class="pm-tablewrap"><table class="pm-table"><thead><tr><th>日時</th><th>種別</th><th>内容</th><th style="text-align:right">増減</th></tr></thead><tbody>${pmHistory.filter(h=>pmPointFilter==='all'||h.type===pmPointFilter).map(h=>`<tr><td class="pm-num">${h.date}</td><td>${({auto:'自動付与',manual:'手動付与',redeem:'景品交換',present:'プレゼント'})[h.type]}</td><td>${pmEsc(h.content)}</td><td class="pm-num" style="text-align:right;font-weight:700;color:${h.pt<0?'#b74651':'#31816b'}">${h.pt>0?'+':''}${pmFmt(h.pt)} pt</td></tr>`).join('')}</tbody></table></div>`:pmPointTab==='gifts'?`<div class="pm-pad"><div class="pm-gifts">${pmGifts.filter(g=>g.status==='public').map(g=>`<button class="pm-gift" onclick="pmOpenGift(${g.id})"><div class="pm-gift-visual">${g.icon}</div><div class="pm-gift-body"><strong>${pmEsc(g.name)}</strong><p>${pmFmt(g.pt)} pt ${pmBalance<g.pt?'<small class="pm-red">ポイント不足</small>':''}</p></div></button>`).join('')}</div></div>`:`<div class="pm-tablewrap"><table class="pm-table"><thead><tr><th>申請日</th><th>景品</th><th>利用ポイント</th><th>状況</th><th></th></tr></thead><tbody>${pmRedeems.filter(r=>r.user==='田中 花子').map(r=>`<tr class="pm-clickrow" tabindex="0" role="button" onclick="pmRedeemDetail(${r.id})" onkeydown="if(event.key==='Enter')pmRedeemDetail(${r.id})"><td>${r.date}</td><td>${pmEsc(r.name)}</td><td class="pm-num">${pmFmt(r.pt)} pt</td><td><span class="pm-tag ${r.status==='受取済'?'ok':''}">${r.status}</span></td><td>${r.status==='発送済'?pmBtn('受け取りを報告',`event.stopPropagation();pmReceive(${r.id})`):''}</td></tr>`).join('')}</tbody></table></div>`}</section></div>`}
function pmGiftModal(){openModal('ポイントを贈る','',`<div class="pm-fields"><div class="pm-field wide"><label>贈る相手（複数選択可）</label><input class="pm-input" id="pmUserQuery" oninput="pmSearchUsers()" placeholder="名前・社員IDで検索"><div id="pmUserResults"></div><div id="pmSelectedUsers" class="pm-row">${pmReceiverHtml()}</div></div><div class="pm-field"><label>1人あたりのポイント</label><input class="pm-input" id="pmSendPt" type="number" min="1" placeholder="100"></div><div class="pm-field wide"><label>メッセージ（任意）</label><textarea class="pm-area" id="pmSendMessage"></textarea></div></div>`,`<button class="pm-btn" onclick="closeOverlay()">キャンセル</button><button class="pm-btn primary" onclick="pmGiftConfirm()">確認する</button>`)}
function pmReceiverHtml(){return pmReceivers.map(id=>{const u=pmMembers.find(x=>x.id===id);return `<button class="pm-btn" onclick="pmReceivers=pmReceivers.filter(x=>x!=='${id}');pmGiftModal()">${u.name} ×</button>`}).join('')||'<span class="pm-note">相手を選択してください</span>'}
function pmSearchUsers(){const q=document.getElementById('pmUserQuery').value.toLowerCase(),n=document.getElementById('pmUserResults');n.innerHTML=q?pmMembers.filter(u=>u.id!=='EMP001'&&!pmReceivers.includes(u.id)&&(u.id+u.name+u.dept).toLowerCase().includes(q)).map(u=>`<button class="pm-btn" style="margin:4px" onclick="pmReceivers.push('${u.id}');pmGiftModal()">${u.name}・${u.dept} ＋</button>`).join(''):''}
function pmGiftConfirm(){const n=Number(document.getElementById('pmSendPt')?.value);if(!pmReceivers.length||!Number.isInteger(n)||n<1||n*pmReceivers.length>pmBalance){atToast('宛先・ポイント数・残高を確認してください');return}openModal('プレゼント内容を確認','',`<p>${pmReceivers.map(id=>pmMembers.find(u=>u.id===id).name).join('、')} に1人 ${n} ptを贈ります。</p><p><strong>合計 ${pmFmt(n*pmReceivers.length)} pt</strong> ／ 送信後残高 ${pmFmt(pmBalance-n*pmReceivers.length)} pt</p>`,`<button class="pm-btn" onclick="pmGiftModal()">戻る</button><button class="pm-btn primary" onclick="pmGiftApply(${n})">プレゼントする</button>`)}
function pmGiftApply(n){const cost=n*pmReceivers.length;pmBalance-=cost;pmHistory.unshift({date:'2026/10/24 08:30',type:'present',content:'ポイントをプレゼント（'+pmReceivers.length+'人）',pt:-cost});pmReceivers=[];closeOverlay();render();atToast('ポイントを贈りました（モック）')}
function pmOpenGift(id){const g=pmGifts.find(x=>x.id===id);openModal(g.name,'',`<div class="pm-gift-visual" style="max-width:340px">${g.icon}</div><p>${g.description}</p><p><strong>${pmFmt(g.pt)} pt</strong> ／ 残高 ${pmFmt(pmBalance)} pt</p>`,`<button class="pm-btn" onclick="closeOverlay()">閉じる</button><button class="pm-btn primary" ${pmBalance<g.pt?'disabled':''} onclick="pmGiftRedeemConfirm(${id})">交換を申請</button>`)}
function pmGiftRedeemConfirm(id){const g=pmGifts.find(x=>x.id===id);openModal('交換申請の確認','',`<p><strong>${pmEsc(g.name)}</strong> に ${pmFmt(g.pt)} ptを利用します。</p><p>交換後：${pmFmt(pmBalance-g.pt)} pt</p>`,`<button class="pm-btn" onclick="pmOpenGift(${id})">戻る</button><button class="pm-btn primary" onclick="pmRedeemGift(${id})">申請する</button>`)}
function pmRedeemGift(id){const g=pmGifts.find(x=>x.id===id);if(pmBalance<g.pt)return;pmBalance-=g.pt;pmRedeems.unshift({id:Date.now(),name:g.name,user:'田中 花子',date:'2026/10/24',pt:g.pt,status:'申請中'});pmHistory.unshift({date:'2026/10/24 08:30',type:'redeem',content:g.name,pt:-g.pt});closeOverlay();pmPointTab='redeems';render();atToast('交換申請を受け付けました（モック）')}
function pmRedeemFlow(status){const states=['申請中','承認済','発送済','受取済'];return status==='非承認'||status==='キャンセル'?`<span class="pm-tag pm-rejected">${status}</span>`:states.map((v,i)=>`<span class="pm-step ${states.indexOf(status)>=i?'done':''}">${v}</span>`).join('<span class="pm-flow-arrow">→</span>')}
function pmRedeemDetail(id){const r=pmRedeems.find(x=>x.id===id);if(!r)return;openModal('景品交換の状況','',`<dl class="pm-detail"><dt>景品</dt><dd>${pmEsc(r.name)}</dd><dt>申請日</dt><dd>${r.date}</dd><dt>利用ポイント</dt><dd>${pmFmt(r.pt)} pt</dd><dt>状況</dt><dd><strong>${r.status}</strong></dd></dl><div class="pm-process">${pmRedeemFlow(r.status)}</div>`,`<button class="pm-btn" onclick="closeOverlay()">閉じる</button>${r.status==='発送済'?`<button class="pm-btn primary" onclick="pmReceive(${id})">受け取りを完了する</button>`:''}`)}
function pmReceive(id){const r=pmRedeems.find(x=>x.id===id);openModal('受け取りを報告','',`<p>${pmEsc(r.name)} を受け取りましたか？</p>`,`<button class="pm-btn" onclick="closeOverlay()">キャンセル</button><button class="pm-btn primary" onclick="pmRedeems.find(x=>x.id===${id}).status='受取済';closeOverlay();render()">受取済みにする</button>`)}
let pmAdminTab='grants',pmExchangeFilter='all';
function pmPointsAdmin(){let tabs=[['grants','ポイント付与'],['rules','自動付与ルール'],['exchange','景品交換の申請'],['catalog','景品管理']];return `<div class="pm-wrap"><div class="pm-top"><div class="pm-segment">${tabs.map(([k,t])=>`<button class="${pmAdminTab===k?'on':''}" onclick="pmAdminTab='${k}';render()">${t}</button>`).join('')}</div>${pmAdminTab==='grants'?pmBtn('CSV一括付与',`pmCsvModal()`):pmAdminTab==='catalog'?pmBtn('＋ 景品を追加',`pmNewGiftModal()`,true):''}</div>${pmAdminTab==='grants'?pmAdminGrantView():pmAdminTab==='rules'?pmAdminRules():pmAdminTab==='exchange'?pmAdminExchanges():pmAdminCatalog()}</div>`}
function pmAdminGrantView(){return `<section class="pm-surface"><div class="pm-h"><h2>ポイントを付与する</h2></div><div class="pm-pad"><div class="pm-fields"><div class="pm-field wide"><label>対象メンバー</label><div class="pm-row"><input id="pmGrantSearch" class="pm-input" style="max-width:300px" oninput="pmGrantFind()" placeholder="社員名・社員IDで検索"><span class="pm-note">複数人選択できます</span></div><div id="pmGrantFound"></div><div id="pmGrantSelected" class="pm-row"></div></div><div class="pm-field"><label>項目名</label><input id="pmGrantLabel" class="pm-input" placeholder="例：会社設立記念"></div><div class="pm-field"><label>付与ポイント</label><input id="pmGrantAmount" type="number" min="1" class="pm-input" placeholder="100"></div><div class="pm-field"><label>付与日時</label><input class="pm-input" type="datetime-local" id="pmGrantAt"><small class="pm-note">空欄の場合は即時付与</small></div><div class="pm-field wide"><label>理由（任意）</label><textarea class="pm-area" id="pmGrantReason"></textarea></div></div><div class="pm-row" style="justify-content:flex-end;margin-top:15px">${pmBtn('付与内容を確認',`pmGrantConfirm()`,true)}</div></div></section><section class="pm-surface"><div class="pm-h"><h2>最近の付与履歴</h2></div><div class="pm-tablewrap"><table class="pm-table"><thead><tr><th>日時</th><th>対象</th><th>項目名</th><th>理由</th><th>付与pt</th><th>実行者</th></tr></thead><tbody>${[['10/21 14:22','田中 花子','会社設立記念','会社設立記念日','+1,000 pt'],['10/21 14:22','山田 次郎','会社設立記念','会社設立記念日','+1,000 pt'],['10/10 09:30','全社員（32名）','誕生日ボーナス','CSV一括付与','+100 pt']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}<td>管理 太郎</td></tr>`).join('')}</tbody></table></div></section>`}
let pmGrantIds=[];
function pmGrantFind(){const q=document.getElementById('pmGrantSearch').value.toLowerCase();document.getElementById('pmGrantFound').innerHTML=q?pmMembers.filter(u=>!pmGrantIds.includes(u.id)&&(u.name+u.id+u.dept).toLowerCase().includes(q)).map(u=>`<button class="pm-btn" style="margin:4px" onclick="pmGrantIds.push('${u.id}');pmGrantRefresh()">${u.name} ＋</button>`).join(''):''}
function pmGrantRefresh(){document.getElementById('pmGrantSelected').innerHTML=pmGrantIds.map(id=>`<button class="pm-btn" onclick="pmGrantIds=pmGrantIds.filter(x=>x!=='${id}');pmGrantRefresh()">${pmMembers.find(u=>u.id===id).name} ×</button>`).join('');pmGrantFind()}
function pmGrantConfirm(){const amount=Number(document.getElementById('pmGrantAmount').value),label=document.getElementById('pmGrantLabel').value;const at=document.getElementById('pmGrantAt')?.value||'';if(!pmGrantIds.length||!label.trim()||!Number.isInteger(amount)||amount<1){atToast('対象・項目名・ポイント数を入力してください');return}openModal('付与内容の確認','',`<p>対象 ${pmGrantIds.length}名 ／ ${pmEsc(label)} ／ 1人 ${amount} pt</p><p><strong>付与日時：${at?at.replace('T',' '): '即時'}</strong></p><p>合計 ${pmFmt(pmGrantIds.length*amount)} pt</p>`,`<button class="pm-btn" onclick="closeOverlay()">戻る</button><button class="pm-btn primary" onclick="pmGrantIds=[];closeOverlay();render();atToast(at?'指定日時での付与を予約しました（モック）':'ポイントを付与しました（モック）')">付与を確定</button>`)}
function pmCsvModal(){openModal('CSV一括付与','',`<label class="pm-file">CSVファイルを選択<input id="pmCsvFile" type="file" accept=".csv" onchange="pmCsvRead(this)"></label><p class="pm-note">列：社員ID、ポイント数、項目名、理由（1行目ヘッダー）</p><div id="pmCsvResult" class="pm-note"></div>`,`<button class="pm-btn" onclick="closeOverlay()">閉じる</button><button id="pmCsvApply" class="pm-btn primary" disabled onclick="closeOverlay();atToast('CSV付与の実行イメージです（モック）')">一括付与</button>`)}
function pmCsvRead(input){const f=input.files?.[0];if(!f)return;document.getElementById('pmCsvResult').textContent=f.name+' を選択しました。実装時は内容・重複・社員IDを検証してから確定します。';document.getElementById('pmCsvApply').disabled=false}
function pmAdminRules(){return `<section class="pm-surface"><div class="pm-h"><h2>自動付与ルール</h2></div><div class="pm-tablewrap"><table class="pm-table"><thead><tr><th>アクション</th><th>ポイント／回</th><th>月間上限</th><th>使用</th><th></th></tr></thead><tbody>${pmRules.map((r,i)=>`<tr><td><strong>${r[1]}</strong><div class="pm-sub">${r[0]}</div></td><td><input class="pm-input" id="pmRulePt${i}" type="number" min="0" style="width:100px" value="${r[2]}"></td><td><input class="pm-input" id="pmRuleCap${i}" type="number" min="0" style="width:100px" value="${r[3]}"></td><td><input type="checkbox" id="pmRuleOn${i}" ${r[4]?'checked':''}></td><td>${pmBtn('保存',`pmSaveRule(${i})`)}</td></tr>`).join('')}</tbody></table></div></section>`}
function pmSaveRule(i){const n=Number(document.getElementById('pmRulePt'+i).value),m=Number(document.getElementById('pmRuleCap'+i).value);if(!Number.isInteger(n)||n<0||!Number.isInteger(m)||m<0){atToast('整数で入力してください');return}pmRules[i][2]=n;pmRules[i][3]=m;pmRules[i][4]=document.getElementById('pmRuleOn'+i).checked;atToast('ルールを保存しました（モック）')}
function pmAdminExchanges(){return `<section class="pm-surface"><div class="pm-h"><h2>景品交換申請</h2><select class="pm-select" onchange="pmExchangeFilter=this.value;render()"><option value="all">すべて</option>${['申請中','承認済','非承認','発送済','受取済','キャンセル'].map(s=>`<option ${pmExchangeFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="pm-tablewrap"><table class="pm-table"><thead><tr><th>申請日</th><th>申請者</th><th>景品</th><th>必要ポイント</th><th>状況</th><th></th></tr></thead><tbody>${pmRedeems.filter(r=>pmExchangeFilter==='all'||r.status===pmExchangeFilter).map(r=>`<tr class="pm-clickrow" tabindex="0" onclick="pmManageRedeem(${r.id})"><td>${r.date}</td><td>${r.user}</td><td>${pmEsc(r.name)}</td><td class="pm-num">${pmFmt(r.pt)} pt</td><td><span class="pm-tag">${r.status}</span></td><td><span class="pm-row-arrow">›</span></td></tr>`).join('')}</tbody></table></div></section>`}
function pmManageRedeem(id){const r=pmRedeems.find(x=>x.id===id);const next=r.status==='申請中'?`<button class="pm-btn" onclick="pmSetRedeem(${id},'非承認')">非承認にする</button><button class="pm-btn primary" onclick="pmSetRedeem(${id},'承認済')">承認する</button>`:r.status==='承認済'?`<button class="pm-btn primary" onclick="pmSetRedeem(${id},'発送済')">発送済みにする</button>`:'';openModal('景品交換申請','',`<dl class="pm-detail"><dt>申請者</dt><dd>${pmEsc(r.user)}</dd><dt>景品</dt><dd>${pmEsc(r.name)}</dd><dt>申請日</dt><dd>${r.date}</dd><dt>使用ポイント</dt><dd>${pmFmt(r.pt)} pt</dd><dt>状態</dt><dd>${r.status}</dd></dl><div class="pm-process">${pmRedeemFlow(r.status)}</div>`,`<button class="pm-btn" onclick="closeOverlay()">閉じる</button>${next}`)}
function pmSetRedeem(id,status){const r=pmRedeems.find(x=>x.id===id);if(!r)return;const allowed={'申請中':['承認済','非承認'],'承認済':['発送済']};if(!(allowed[r.status]||[]).includes(status))return; r.status=status;if(status==='非承認'&&r.user==='田中 花子'){pmBalance+=r.pt;pmHistory.unshift({date:'2026/10/24',type:'redeem',content:r.name+'（非承認・ポイント返還）',pt:r.pt})}closeOverlay();render();atToast('状態を更新しました（モック）')}
function pmAdminCatalog(){return `<section class="pm-surface"><div class="pm-h"><h2>景品一覧</h2></div><div class="pm-tablewrap"><table class="pm-table"><thead><tr><th>景品名</th><th>必要ポイント</th><th>交換数</th><th>公開状態</th><th></th></tr></thead><tbody>${pmGifts.map(g=>`<tr><td>${g.icon}　${pmEsc(g.name)}</td><td>${pmFmt(g.pt)} pt</td><td>${g.count}</td><td><span class="pm-tag ${g.status==='public'?'ok':'dim'}">${g.status==='public'?'公開中':'停止中'}</span></td><td>${pmBtn('編集',`pmEditGiftModal(${g.id})`)} ${pmBtn(g.status==='public'?'公開停止':'再公開',`pmGiftToggle(${g.id})`)}</td></tr>`).join('')}</tbody></table></div></section>`}
function pmGiftToggle(id){const g=pmGifts.find(x=>x.id===id);g.status=g.status==='public'?'stopped':'public';render()}
function pmNewGiftModal(){pmGiftForm(null)}function pmEditGiftModal(id){pmGiftForm(pmGifts.find(x=>x.id===id))}
function pmGiftForm(g){openModal(g?'景品を編集':'景品を追加','',`<div class="pm-fields"><div class="pm-field wide"><label>景品名</label><input class="pm-input" id="pmGName" value="${pmEsc(g?.name||'')}"></div><div class="pm-field"><label>必要ポイント</label><input class="pm-input" type="number" id="pmGPt" value="${g?.pt||''}"></div><div class="pm-field wide"><label>説明</label><textarea class="pm-area" id="pmGDesc">${pmEsc(g?.description||'')}</textarea></div><div class="pm-field wide"><label>画像</label><input class="pm-input" type="file" accept="image/*" id="pmGImage"><small class="pm-note">本モックでは画像は永続保存されません</small></div></div>`,`<button class="pm-btn" onclick="closeOverlay()">キャンセル</button><button class="pm-btn primary" onclick="pmSaveGift(${g?.id||'null'})">保存</button>`)}
function pmSaveGift(id){const name=document.getElementById('pmGName').value.trim(),pt=Number(document.getElementById('pmGPt').value);if(!name||!Number.isInteger(pt)||pt<1){atToast('景品名・必要ポイントを確認してください');return}const desc=document.getElementById('pmGDesc').value;if(id){Object.assign(pmGifts.find(x=>x.id===id),{name,pt,description:desc})}else pmGifts.push({id:Date.now(),name,pt,description:desc,icon:'🎁',count:0,status:'stopped'});closeOverlay();render();atToast('景品情報を保存しました（モック）')}
let pmContractRole='user',pmContractMode='list',pmDocType='ks',pmContractId=1,pmDocReview='all';

let onFollowFilter='all',onFollowQuery='';
function rtBoard(admin=false){const items=rtCases.filter(x=>(admin||x.person==='鈴木 花子')&&(onFollowFilter==='all'||x.type===onFollowFilter)&&(`${x.person} ${x.type} ${x.next} ${x.step}`.includes(onFollowQuery)));return `<div class="rt-v42-filter"><select aria-label="手続きで絞り込む" onchange="onFollowFilter=this.value;render()"><option value="all" ${onFollowFilter==='all'?'selected':''}>すべての手続き</option>${[...new Set(rtCases.map(x=>x.type))].map(k=>`<option value="${anEsc(k)}" ${onFollowFilter===k?'selected':''}>${anEsc(k)}</option>`).join('')}</select><input aria-label="対応予定を検索" placeholder="氏名・手続き・対応内容で検索" value="${anEsc(onFollowQuery)}" oninput="onFollowQuery=this.value;onFollowUpdate(${admin})"></div><div class="rt-board-v42" id="rtBoardRows"><div class="rt-v42-head"><span>${admin?'対象者':'手続き'}</span><span>${admin?'手続き':'状況'}</span><span>次に必要な対応</span><span>対応予定日</span><span>状況</span></div>${rtRows(items,admin)}</div>`}
function rtRows(items,admin){return items.length?items.map(r=>`<button type="button" class="rt-v42-row" onclick="rtOpen(${r.id},${admin})"><span>${admin?anEsc(r.person):anEsc(r.type)}</span><span>${admin?anEsc(r.type):anEsc(r.step)}</span><span class="rt-v42-main">${anEsc(r.next)}<small class="rt-v42-sub">${anEsc(r.note)}</small></span><span>${anEsc(r.date)}</span><span style="color:#7357a8;font-size:12px;font-weight:650">予定あり →</span></button>`).join(''):'<div class="rt-v42-empty">該当する対応予定はありません。</div>'}
function onFollowUpdate(admin){const rows=rtCases.filter(x=>(admin||x.person==='鈴木 花子')&&(onFollowFilter==='all'||x.type===onFollowFilter)&&(`${x.person} ${x.type} ${x.next} ${x.step}`.includes(onFollowQuery)));const root=document.querySelector('#rtBoardRows');if(root)root.innerHTML=`<div class="rt-v42-head"><span>${admin?'対象者':'手続き'}</span><span>${admin?'手続き':'状況'}</span><span>次に必要な対応</span><span>対応予定日</span><span>状況</span></div>${rtRows(rows,admin)}`}
function rtOpen(id,admin){const r=rtCases.find(x=>x.id===id);if(!r)return;openModal(r.next,`${r.person} ・ ${r.type}`,`<div class="ap-detail"><dl class="ap-detail-list"><dt>現在の状況</dt><dd>${anEsc(r.step)}</dd><dt>次の対応</dt><dd>${anEsc(r.next)}</dd><dt>対応予定日</dt><dd>${anEsc(r.date)}</dd><dt>確認事項</dt><dd>${anEsc(r.note)}</dd></dl></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button><button class="btn primary" onclick="closeOverlay();navigate('${admin?'members-admin':'applications'}')">${admin?'メンバー管理を開く':'各種申請を開く'} →</button>`)}
const onRoleTargets=['メンバー','勤怠表','各種申請','お知らせ','コミュニティ','ポイント','営業支援','契約書類','賞与確認','設定'];
let onRoleValue='承認者';let onRoleMatrix={};
function onRoleEditor(){const roles=['一般社員','承認者','システム管理者'];openModal('権限ロールの設定','',`<div class="on-role-wrap"><label style="display:grid;gap:7px;font-size:14px">編集するロール<select id="onRoleSelect" onchange="onRoleValue=this.value;onRoleDraw()" style="font-size:14px;padding:10px;border:1px solid #dddde4;border-radius:5px">${roles.map(r=>`<option ${r===onRoleValue?'selected':''}>${r}</option>`).join('')}</select></label><div id="onRoleTable"></div><p style="color:#81818b;font-size:12px">機能ごとに閲覧・登録編集・承認管理を指定します。ここでは変更内容をモック内で保持します。</p></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button><button class="btn primary" onclick="onRoleSave()">設定を保存</button>`);onRoleDraw()}
function onRoleDraw(){const t=document.getElementById('onRoleTable');if(!t)return;const rows=onRoleTargets.map(name=>{const d=(onRoleMatrix[onRoleValue]||{})[name]||[true,onRoleValue!=='一般社員',onRoleValue==='システム管理者'];return `<div class="on-role-row"><strong>${name}</strong>${d.map((v,i)=>`<label style="text-align:center"><input aria-label="${name} ${['閲覧','編集','承認・管理'][i]}" type="checkbox" data-role-target="${name}" data-role-index="${i}" ${v?'checked':''}></label>`).join('')}</div>`}).join('');t.innerHTML=`<div class="on-role-row head"><span>機能</span><span>閲覧</span><span>編集</span><span>承認・管理</span></div>${rows}`}
function onRoleSave(){const next={};document.querySelectorAll('[data-role-target]').forEach(e=>{const k=e.dataset.roleTarget;if(!next[k])next[k]=[];next[k][+e.dataset.roleIndex]=e.checked});onRoleMatrix[onRoleValue]=next;closeOverlay();atToast('権限ロールの設定を保存しました')}

function v44DragStart(e,id){v44DragId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('v44-dragging')}
function v44DragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('v44-over')}
function v44Drop(e,id){e.preventDefault();e.stopPropagation();if(v44DragId&&v44DragId!==id){let from=v44AccountDraft.findIndex(x=>x.id===v44DragId),to=v44AccountDraft.findIndex(x=>x.id===id);if(from>=0&&to>=0){const [item]=v44AccountDraft.splice(from,1);v44AccountDraft.splice(to,0,item)}}v44DragId=null;v44DrawAccounts()}
function v44DragEnd(){v44DragId=null;document.querySelectorAll('.v44-account-row').forEach(e=>e.classList.remove('v44-over','v44-dragging'))}

let v44FineRoles={};
function v44RolePerms(role,key,actions){v44FineRoles[role]??={};if(!v44FineRoles[role][key]){const base=v43RoleData[role]?.[key]||[false,false,false];v44FineRoles[role][key]=actions.map((a,i)=>i===0?!!base[0]:(a.includes('承認')||a.includes('管理')||a.includes('削除')||a.includes('公開')||a.includes('付与'))?!!base[2]:!!base[1])}return v44FineRoles[role][key]}

function v43DrawRole(){const el=document.getElementById('v43RoleMatrix');if(!el)return;let html='';for(const [category,rows] of v44Sections){html+='<section class="v44-perm-section"><h4>'+category+'</h4>';for(const [label,key,actions] of rows){const perms=v44RolePerms(v43Role,key,actions);html+='<div class="v44-perm-row"><div class="v44-perm-name">'+label+'</div><div class="v44-perm-checks">';actions.forEach((a,i)=>{html+='<label><input type="checkbox" data-v44-feature="'+key+'" data-v44-index="'+i+'" '+(perms[i]?'checked':'')+'>'+a+'</label>'});html+='</div></div>'}html+='</section>'}el.innerHTML=html}

function v43SaveRole(){v44CaptureRole();v44Sections.forEach(([g,rows])=>rows.forEach(([label,key,actions])=>{const p=v44FineRoles[v43Role][key];v43RoleData[v43Role][key]=[!!p[0],p.slice(1).some(Boolean),p.slice(1).some((on,i)=>on&&/承認|管理|削除|公開|付与/.test(actions[i+1]||''))]}));v43Audit.unshift({date:'2026/10/24 19:43',actor:'管理 太郎',kind:'権限変更',target:v43Role,action:'機能別アクセス権限を更新',before:'変更前',after:'更新済み'});closeOverlay();atToast('ロールの設定を保存しました')}

<script>

v43SettingsSections.manager=v43SettingsSections.manager.filter(row=>row[0]!=='forms');
let v45LeaveYear='2026';let v45LeaveSearch='';let v45LeaveFilter='all';
const v45LeavePeople=[
{id:'EMP001',name:'管理 太郎',dept:'情報システム部',joined:'2021-04-01',previous:1,current:2,borrowed:2,next:10,nextDate:'2027-04-01',previousExpiry:'2026-12-31',summerUsed:1,holidayWork:1,substituteUsed:0},

{id:'EMP003',name:'閲覧 次郎',dept:'経営企画部',joined:'2025-06-03',previous:0,current:0,borrowed:2,next:11,nextDate:'2027-06-03',previousExpiry:'2026-12-02',summerUsed:0,holidayWork:1,substituteUsed:1},

{id:'EMP005',name:'営業 四郎',dept:'営業部',joined:'2023-02-01',previous:4,current:5,borrowed:0,next:12,nextDate:'2027-02-01',previousExpiry:'2027-01-31',summerUsed:2,holidayWork:2,substituteUsed:1},
{id:'EMP006',name:'dev_potaI002 Entra',dept:'情報システム部',joined:'2024-08-01',previous:0,current:0,borrowed:6,next:11,nextDate:'2027-08-01',previousExpiry:'',summerUsed:0,holidayWork:0,substituteUsed:0}
];
let v45LeavePolicy={borrow:true,summerMay:3,summerJune:2,summerJuly:1,summerReset:'12-31',half:true,carry:2,substituteMonth:true,requireProof:false};
function v45Fmt(n){return Number.isInteger(n)?String(n):String(n.toFixed(1))}
function v45SummerGrant(p){const month=Number(p.joined.substring(5,7));return month<=5?v45LeavePolicy.summerMay:month===6?v45LeavePolicy.summerJune:month===7?v45LeavePolicy.summerJuly:0}
function v45BorrowAvailable(p){return v45LeavePolicy.borrow&&p.previous+p.current<=0?Math.max(0,p.next-p.borrowed):0}
function v45LeaveEditor(){v43LeaveEditor()}
v43LeaveEditor=function(){openModal('休暇付与台帳','',`<div class="v43-modal-content"><div class="v45-tools"><input id="v45LeaveSearch" placeholder="氏名・社員番号・所属で検索" oninput="v45LeaveSearch=this.value;v45DrawLeave()" value="${anEsc(v45LeaveSearch)}"><select onchange="v45LeaveFilter=this.value;v45DrawLeave()"><option value="all" ${v45LeaveFilter==='all'?'selected':''}>すべての社員</option><option value="zero" ${v45LeaveFilter==='zero'?'selected':''}>通常有休なし</option><option value="borrow" ${v45LeaveFilter==='borrow'?'selected':''}>前借り利用中</option><option value="expiry" ${v45LeaveFilter==='expiry'?'selected':''}>前年度残あり</option></select><select onchange="v45LeaveYear=this.value;v45DrawLeave()"><option value="2026">2026年度</option></select></div><div id="v45LeaveTable"></div><p class="v45-note">社員の行を選択すると、付与・利用・失効日と調整履歴を確認できます。数値はモック用のサンプルです。</p><div class="v45-actionrow"><span></span><button class="btn" onclick="v45PolicyEditor()">会社の休暇ルールを設定 →</button></div></div>`,`<button class="btn primary" onclick="closeOverlay()">閉じる</button>`);v45DrawLeave()};
function v45DrawLeave(){const el=document.getElementById('v45LeaveTable');if(!el)return;let rows=v45LeavePeople.filter(p=>(p.name+p.id+p.dept).toLowerCase().includes(v45LeaveSearch.toLowerCase())&&(v45LeaveFilter==='all'||v45LeaveFilter==='zero'&&p.previous+p.current===0||v45LeaveFilter==='borrow'&&p.borrowed>0||v45LeaveFilter==='expiry'&&p.previous>0));el.innerHTML=`<div class="v45-table-wrap"><table class="v45-table"><thead><tr><th>社員</th><th>通常有休</th><th>前年度残</th><th>前借り可能</th><th>夏季休暇</th><th>次回付与</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr data-person onclick="v45LeaveDetail('${p.id}')"><td><strong>${anEsc(p.name)}</strong><div class="v45-muted">${p.id} · ${anEsc(p.dept)}</div></td><td><span class="number ${p.previous+p.current===0?'v45-amber':''}">${v45Fmt(p.previous+p.current)}日</span></td><td>${v45Fmt(p.previous)}日</td><td><strong class="${v45BorrowAvailable(p)?'v45-purple':''}">${v45Fmt(v45BorrowAvailable(p))}日</strong>${p.borrowed?`<div class="v45-muted">利用済 ${v45Fmt(p.borrowed)}日</div>`:''}</td><td>${v45Fmt(Math.max(0,v45SummerGrant(p)-p.summerUsed))}日</td><td><strong>${v45Fmt(p.next)}日</strong><div class="v45-muted">${p.nextDate}</div></td><td class="v45-purple">›</td></tr>`).join('')||'<tr><td colspan="7">該当する社員はいません</td></tr>'}</tbody></table></div>`}
function v45LeaveDetail(id){const p=v45LeavePeople.find(x=>x.id===id);if(!p)return;let balance=p.previous+p.current;openModal(p.name+'｜休暇付与台帳',`${p.id} ／ ${p.dept}`,`<div class="v43-modal-content"><div class="v45-summary"><div><span class="v45-muted">通常有休残</span><strong>${v45Fmt(balance)}日分</strong></div><div><span class="v45-muted">前借り可能</span><strong>${v45Fmt(v45BorrowAvailable(p))}日分</strong></div><div><span class="v45-muted">夏季休暇残</span><strong>${v45Fmt(Math.max(0,v45SummerGrant(p)-p.summerUsed))}日分</strong></div><div><span class="v45-muted">代休可能</span><strong>${v45Fmt(v45LeavePolicy.substituteMonth?Math.max(0,p.holidayWork-p.substituteUsed):p.holidayWork)}日分</strong></div></div><div class="v45-minihead">有給休暇の内訳</div><div class="v45-keyvals"><div><span>前年度残日数</span><strong>${v45Fmt(p.previous)}日分</strong></div>${p.previous?`<div><span>前年度の失効日</span><strong>${p.previousExpiry}</strong></div>`:''}<div><span>当年度残日数</span><strong>${v45Fmt(p.current)}日分</strong></div><div><span>翌年度の付与予定</span><strong>${v45Fmt(p.next)}日分</strong></div><div><span>翌年度の付与予定日</span><strong>${p.nextDate}</strong></div><div><span>前借り利用済み</span><strong>${v45Fmt(p.borrowed)}日分</strong></div></div><div class="v45-detailbox"><strong>申請時の選択可否</strong><div class="v45-chips"><span>有給休暇：${balance>0?'選択可':'選択不可'}</span><span>前借り有給休暇：${v45BorrowAvailable(p)>0?'選択可':'選択不可'}</span><span>夏季休暇：${v45SummerGrant(p)-p.summerUsed>0?'選択可':'選択不可'}</span><span>代休：${p.holidayWork>p.substituteUsed?'選択可':'選択不可'}</span></div></div><div class="v45-minihead">台帳の調整</div><div class="v45-controls"><label class="v45-field">調整日数（0.5日単位）<input id="v45AdjustAmount" type="number" step="0.5" value="0"></label><label class="v45-field">調整対象<select id="v45AdjustType"><option value="current">当年度の有休</option><option value="previous">前年度の有休</option><option value="summerUsed">夏季休暇の利用日数</option></select></label><label class="v45-field" style="grid-column:1/-1">調整理由<input id="v45AdjustReason" placeholder="理由を入力"></label></div><div class="v45-note">変更は操作履歴へ記録する想定です。実際の付与判定には社員の入社日・付与履歴・勤務状況などが必要です。</div></div>`,`<button class="btn" onclick="v43LeaveEditor()">一覧へ戻る</button><button class="btn primary" onclick="v45SaveLeave('${id}')">調整を記録</button>`)}
function v45SaveLeave(id){const p=v45LeavePeople.find(x=>x.id===id),delta=Number(document.getElementById('v45AdjustAmount')?.value),target=document.getElementById('v45AdjustType')?.value,reason=document.getElementById('v45AdjustReason')?.value.trim();if(!p||!Number.isFinite(delta)||delta===0||Math.round(delta*2)!==delta*2||!reason){atToast('調整日数と理由を確認してください');return}if(p[target]+delta<0){atToast('残日数はマイナスにできません');return}p[target]+=delta;v43Audit.unshift({date:'2026/10/24 20:00',actor:'管理 太郎',kind:'休暇調整',target:p.id,action:'休暇台帳の調整：'+reason,before:'',after:target+' '+delta+'日'});v45LeaveDetail(id);atToast('調整を反映しました（モック）')}
function v45PolicyEditor(){openModal('会社の休暇ルール','',`<div class="v43-modal-content"><div class="v45-config-head">有給休暇と前借り</div><div class="v45-setting-block"><label class="v45-field">前借りの利用<select id="v45Borrow"><option value="yes" ${v45LeavePolicy.borrow?'selected':''}>通常有休がなくなったら、次回付与予定分まで利用可</option><option value="no" ${!v45LeavePolicy.borrow?'selected':''}>前借りを利用しない</option></select></label><div class="v45-note">前借り分は次回付与時に控除する想定。前年度・当年度の有休が残っている間は前借りを選べません。</div></div><div class="v45-setting-block"><label class="v45-field">通常有休の失効までの年数<select id="v45Carry"><option value="2" ${v45LeavePolicy.carry===2?'selected':''}>2年</option><option value="1" ${v45LeavePolicy.carry===1?'selected':''}>1年</option></select></label></div><div class="v45-config-head">夏季休暇</div><div class="v45-controls"><label class="v45-field">5月以前の入社（日）<input id="v45May" type="number" min="0" value="${v45LeavePolicy.summerMay}"></label><label class="v45-field">6月入社（日）<input id="v45June" type="number" min="0" value="${v45LeavePolicy.summerJune}"></label><label class="v45-field">7月入社（日）<input id="v45July" type="number" min="0" value="${v45LeavePolicy.summerJuly}"></label><label class="v45-field">失効・リセット日<select id="v45Reset"><option value="12-31">12月31日</option><option value="03-31">3月31日</option></select></label></div><div class="v45-config-head">申請時の制御</div><div class="v45-setting-block"><label><input id="v45Half" type="checkbox" ${v45LeavePolicy.half?'checked':''}> 半日休暇（AM／PM）の申請を許可する</label></div><div class="v45-setting-block"><label><input id="v45Sub" type="checkbox" ${v45LeavePolicy.substituteMonth?'checked':''}> 代休は同月内の休日出勤分のみ利用可（翌月へ繰り越さない）</label></div><div class="v45-config-head">休暇の種類と選択肢</div><div class="v45-chips"><span>有給休暇</span><span>前借り有給休暇</span><span>特別休暇</span><span>欠勤</span><span>代休</span></div><div class="v45-keyvals"><div><span>特別休暇</span><strong>夏季休暇・慶弔休暇・自社都合・客先都合</strong></div><div><span>慶弔休暇</span><strong>慶事・弔事（個別理由を選択）</strong></div></div><p class="v45-note">慶弔休暇・自社都合・客先都合・欠勤は常時選択可。慶弔理由と日数は会社の規程に合わせて別途定義する想定です。</p><div class="v45-preview">設定によって、社員の申請フォームで選べる休暇種別と残日数表示が切り替わります。ここでは保存後の台帳表示を確認できます。</div></div>`,`<button class="btn" onclick="v43LeaveEditor()">戻る</button><button class="btn primary" onclick="v45SavePolicy()">ルールを保存</button>`)}
function v45SavePolicy(){const vals=['v45May','v45June','v45July'].map(id=>Number(document.getElementById(id).value));if(vals.some(n=>!Number.isInteger(n)||n<0)){atToast('付与日数を確認してください');return}Object.assign(v45LeavePolicy,{borrow:document.getElementById('v45Borrow').value==='yes',carry:Number(document.getElementById('v45Carry').value),summerMay:vals[0],summerJune:vals[1],summerJuly:vals[2],summerReset:document.getElementById('v45Reset').value,half:document.getElementById('v45Half').checked,substituteMonth:document.getElementById('v45Sub').checked});v43Audit.unshift({date:'2026/10/24 20:00',actor:'管理 太郎',kind:'休暇設定',target:'会社の休暇ルール',action:'付与・利用条件を変更',before:'',after:'更新済'});v43LeaveEditor();atToast('休暇ルールを保存しました（モック）')}
const v45PriorSettingsPanel=v43SettingsPanel;
v43SettingsPanel=function(key,admin){if(admin&&key==='leave')return `<h3>休暇・勤怠</h3>${onSettingRow('休暇付与台帳','社員全員の残日数・前借り・次回付与を確認',v43Buttons('社員の台帳を見る','v43LeaveEditor()'))}${onSettingRow('会社の休暇ルール','有休・前借り・夏季休暇・代休の付与と利用条件',v43Buttons('休暇ルールを設定','v45PolicyEditor()'))}${onSettingRow('休日と勤怠集計','法定休日・週の起算日・休憩ルール',v43Buttons('休日と勤怠の設定','v43AttendanceSettings()'))}${onSettingRow('勤怠の提出期限','月末営業日・翌月第1営業日の通知時刻',v43Buttons('提出通知を設定','v43NoticeSettings()'))}`;return v45PriorSettingsPanel(key,admin)};

<script id="onport-v51-features">
// Salesperson and engineer share the same page entry. The selector is only a prototype fallback;
// production must resolve it from the signed-in user's role, not administrator-menu access.
salesScreen=function(){return `<div class="op-role-switch"><div></div><select aria-label="モック表示の切り替え" onchange="opSalesPersona=this.value;render()"><option value="sales" ${opSalesPersona==='sales'?'selected':''}>営業画面</option><option value="engineer" ${opSalesPersona==='engineer'?'selected':''}>社員画面</option></select></div>${opSalesPersona==='sales'?opSalesOriginal():opEngineerSales()}`};
// The mock offers are editable workflow records so the decision and conversation are demonstrable.
const opOfferState={};
const opOldClose=closeOverlay;closeOverlay=function(){opOldClose();document.getElementById("drawer")?.classList.remove("op-offer-drawer")};
function opOfferRecord(id){if(!opOfferState[id])opOfferState[id]={decision:'',messages:[]};return opOfferState[id]}
function opOfferDecide(id,value){const x=opOfferRecord(id);x.decision=value;x.messages.push({me:true,text:value==='accept'?'この案件への参画を希望します。':'今回は辞退させてください。'});opOfferDetail(id)}
function opOfferSend(id){const el=document.getElementById('opOfferMessage');if(!el||!el.value.trim())return;opOfferRecord(id).messages.push({me:true,text:el.value.trim()});opOfferDetail(id)}
opEngineerSales=function(){return `<div class="on-admin-section"><div class="on-admin-head"><h3>自分に届いた案件</h3></div><div class="op-engineer-list"><table><thead><tr><th>提案日</th><th>案件名・提案先</th><th>仕事内容</th><th>返答・進捗</th></tr></thead><tbody>${opEngineerOffers.map(o=>{const p=opOfferRecord(o.id);return `<tr onclick="opOfferDetail('${o.id}')" tabindex="0" onkeydown="if(event.key==='Enter')opOfferDetail('${o.id}')"><td>${o.date}</td><td><strong>${o.subject}</strong><span class="op-split">${o.client}</span></td><td>${o.summary}</td><td><span class="on-att-chip ${p.decision==='decline'?'': 'good'}">${p.decision==='accept'?'参画希望':p.decision==='decline'?'辞退':o.status}</span></td></tr>`}).join('')}</tbody></table></div></div>`};
opOfferDetail=function(id){const o=opEngineerOffers.find(x=>x.id===id);if(!o)return;const p=opOfferRecord(id);const pay=({'s1':'72万円／月','s2':'68万円／月','s3':'65万円／月'})[id];const detail=({'s1':'週2日出社／Javaを中心とする基幹システムの詳細設計・実装・テスト。参画時期は調整可能です。','s2':'業務システムの保守開発。Spring Boot、既存機能の改善。一部リモート勤務。','s3':'Webアプリの追加改修、運用改善。'})[id];closeOverlay();const drawer=document.getElementById('drawer');drawer.classList.add('op-offer-drawer');document.getElementById('drawerTitle').textContent=o.subject;document.getElementById('drawerDesc').textContent='営業担当：'+o.person;const status=p.decision==='accept'?'参画希望を回答済み':p.decision==='decline'?'辞退を回答済み':o.status;const messages=[{me:false,text:'こちらの案件をご提案します。内容をご確認のうえ、ご意向をお知らせください。ご質問もこのチャットで受け付けます。'},...p.messages];document.getElementById('drawerBody').innerHTML=`<div class="op-case-info"><div class="op-case-panel"><h3>案件情報</h3><dl class="op-case-dl"><dt>会社名</dt><dd>${pmEsc(o.client)}</dd><dt>案件名</dt><dd>${pmEsc(o.subject)}</dd><dt>単価</dt><dd>${pay}</dd></dl><p style="margin:14px 0 0;line-height:1.75;font-size:13px">${detail}</p></div><div class="op-case-panel"><h3>提案・回答状況</h3><dl class="op-case-dl"><dt>提案日</dt><dd>${o.date}</dd><dt>状況</dt><dd>${status}</dd><dt>営業担当</dt><dd>${pmEsc(o.person)}</dd></dl><div class="op-offer-actions"><button class="btn primary" onclick="opOfferDecide('${id}','accept')" ${p.decision==='accept'?'disabled':''}>${p.decision==='accept'?'参画希望 回答済み':'参画を希望する'}</button><button class="btn" onclick="opOfferDecide('${id}','decline')" ${p.decision==='decline'?'disabled':''}>${p.decision==='decline'?'辞退 回答済み':'今回は辞退する'}</button></div></div></div><div class="op-chat-shell" style="margin-top:15px"><div class="op-chat-title">営業担当とのチャット</div><div class="op-chat-stream" id="opOfferChatStream">${messages.map(m=>`<div class="op-chat-message ${m.me?'me':''}"><small>${m.me?'あなた':pmEsc(o.person)}</small><div class="op-bubble">${pmEsc(m.text)}</div></div>`).join('')}</div><div class="op-chat-compose"><textarea id="opOfferMessage" placeholder="メッセージを入力（Enterで送信）" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();opOfferSend('${id}')}" ></textarea><button class="btn primary" onclick="opOfferSend('${id}')">送信</button></div></div>`;document.getElementById('scrim').classList.add('show');drawer.classList.add('open');const stream=document.getElementById('opOfferChatStream');if(stream)stream.scrollTop=stream.scrollHeight};
const opBaseGrant=pmAdminGrantView;
pmAdminGrantView=function(){let html=opBaseGrant();const start=html.indexOf('<div class="pm-fields">'),end=html.indexOf('</div></div></section><section class="pm-surface">',start);if(start<0||end<0)return html;const section=`<div class="pm-fields"><div class="pm-field wide"><label>対象メンバー</label><div class="pm-member-control"><div class="pm-member-searchbar"><input id="pmGrantSearch" class="pm-input" oninput="pmGrantFind()" placeholder="名前・社員ID・所属で探す"><select class="pm-input" id="pmGrantGroup" onchange="pmGrantSelectGroup(this.value);this.value='' "><option value="">条件からまとめて選択</option><option value="all">全社員</option>${[...new Set(pmMembers.map(m=>m.dept))].map(d=>`<option value="${pmEsc(d)}">${pmEsc(d)} 全員</option>`).join('')}</select></div><div class="pm-member-found" id="pmGrantFound"></div><div class="pm-member-picked" id="pmGrantSelected"></div></div></div><div class="pm-field"><label>項目名</label><input id="pmGrantLabel" class="pm-input" placeholder="例：会社設立記念"></div><div class="pm-field"><label>付与ポイント</label><input id="pmGrantAmount" type="number" min="1" class="pm-input" placeholder="100"></div><div class="pm-field"><label>付与日時</label><input class="pm-input" type="datetime-local" id="pmGrantAt"></div><div class="pm-field wide"><label>理由（任意）</label><textarea class="pm-area" id="pmGrantReason" placeholder="必要な場合のみ入力"></textarea></div></div><div class="pm-compact-action">${pmBtn('付与内容を確認',`pmGrantConfirm()`,true)}</div>`;return html.slice(0,start)+section+html.slice(end+6).replace('</section><section class="pm-surface">','</section><section class="pm-surface">').replace('<section class="pm-surface">','<section class="pm-surface pm-grant-compact">')};
function pmGrantSelectGroup(group){if(!group)return;let add=group==='all'?pmMembers:pmMembers.filter(u=>u.dept===group);for(const u of add)if(!pmGrantIds.includes(u.id))pmGrantIds.push(u.id);pmGrantRefresh()}
pmGrantFind=function(){const n=document.getElementById('pmGrantFound');if(!n)return;const q=document.getElementById('pmGrantSearch')?.value.trim().toLowerCase()||'';const list=pmMembers.filter(u=>!pmGrantIds.includes(u.id)&&(!q||(u.name+u.id+u.dept).toLowerCase().includes(q)));n.innerHTML=list.slice(0,8).map(u=>`<button type="button" class="pm-candidate-chip" onclick="pmGrantIds.push('${u.id}');pmGrantRefresh()"><span class="pm-chip-plus">＋</span><span class="pm-chip-name">${pmEsc(u.name)}</span><small>${pmEsc(u.dept)}</small></button>`).join('')||'<span class="pm-inline-notice">追加できる社員はいません</span>'};
pmGrantRefresh=function(){const n=document.getElementById('pmGrantSelected');if(!n)return;n.innerHTML=`<span class="pm-selected-title">選択中 ${pmGrantIds.length}名</span>`+(pmGrantIds.length?pmGrantIds.map(id=>{const u=pmMembers.find(x=>x.id===id);return u?`<button type="button" class="pm-picked-chip" aria-label="${pmEsc(u.name)}を選択解除" onclick="pmGrantIds=pmGrantIds.filter(x=>x!=='${id}');pmGrantRefresh()"><span>${pmEsc(u.name)}</span><span class="pm-chip-x" aria-hidden="true">×</span></button>`:''}).join(''):'<span class="pm-inline-notice">未選択</span>');pmGrantFind()};
</script>

<script id="onport-v55-features">

function r60Escape(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function r60Save(){let r=r60Current();if(r.fixed)return;let name=document.getElementById('r60RoleName')?.value.trim();if(!name){atToast('ロール名を入力してください');return}if(r60Roles.some(x=>x!==r&&x.name===name)){atToast('同名のロールがあります');return}const old=r.name;r.name=name;r.permissions=[...document.querySelectorAll('[data-r60-permission]:checked')].map(x=>x.dataset.r60Permission);r60Members.forEach(m=>m.roles=m.roles.map(n=>n===old?name:n));r60Active=name;r60Draw();atToast('ロールを保存しました')}

 };

onAttAdmin=function(){return `<div class="on-admin-wrap"><div class="on-admin-title"><h2>勤怠表管理</h2><span class="on-att-note">2026年10月</span></div><div class="on-admin-section"><div class="on-admin-head"><h3>社員別の提出状況</h3><div class="buttons"><button class="btn" onclick="oa67BulkReturn()">選択した社員へ差し戻し</button></div></div><div class="on-v67-flow"><span>客先勤怠の提出</span><b>→</b><span>自社勤怠の入力補助</span><b>→</b><span>時間差分の確認</span></div><div id="onAttSummary" class="on-att-summary"></div><div id="onAttFilters" class="on-admin-filters"><label>社員検索<input type="search" name="q" placeholder="氏名・社員番号・拠点" oninput="onAttRefresh()"></label><label>提出状況<select name="status" onchange="onAttRefresh()"><option value="all">すべて</option><option>未提出</option><option>提出済</option><option>差し戻し中</option><option>代理提出済</option></select></label><label>残業時間<select name="ot" onchange="onAttRefresh()"><option value="0">指定なし</option><option value="30">30時間以上</option><option value="45">45時間以上</option><option value="60">60時間以上</option></select></label><label>総稼働時間<select name="bound" onchange="onAttRefresh()"><option value="all">すべて</option><option value="out">140〜180時間の範囲外</option><option value="under">140時間未満</option><option value="over">180時間超</option></select></label><label>サブ時間<select name="sub" onchange="onAttRefresh()"><option value="0">指定なし</option><option value="5">5時間以上</option><option value="10">10時間以上</option><option value="20">20時間以上</option></select></label><label>拠点<select name="office" onchange="onAttRefresh()"><option value="all">全拠点</option>${['関東','関西','中部','九州','他地域'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>差分<select name="delta" onchange="onAttRefresh()"><option value="all">すべて</option><option value="yes">差分あり</option><option value="no">差分なし</option><option value="missing">未提出あり</option></select></label></div><div class="on-admin-scroll on-v67-scroll"><table class="on-admin-table on-v67-table"><thead><tr><th style="width:34px"><input type="checkbox" title="表示中を選択" onchange="oa67SelectAll(this.checked)"></th>${onAttTh('社員','name')}${onAttTh('拠点','office')}<th>客先提出</th>${onAttTh('客先合計','clientTotal')}<th>自社提出</th>${onAttTh('自社合計','main')}${onAttTh('差分','delta')}<th>確認事項</th></tr></thead><tbody id="onAttRows"></tbody></table></div></div><div class="on-admin-section"><div class="on-admin-head"><h3>有給休暇の取得状況</h3></div><div id="onAttLeaveFilters" class="on-admin-filters"><label>残日数・期限<select name="leave" onchange="onAttLeaveRefresh()"><option value="all">全社員</option><option value="low">残り5日以下</option><option value="urgent">残り5日以下・失効間近</option></select></label><label>氏名・拠点<input type="search" name="q" placeholder="社員名で検索" oninput="onAttLeaveRefresh()"></label></div><div class="on-admin-scroll"><table class="on-admin-table"><thead><tr>${onAttTh('社員','name')}<th>拠点</th><th>有休残日数</th><th>失効日</th><th>通知状況</th></tr></thead><tbody id="onAttLeaveRows"></tbody></table></div></div></div>`};

function opRgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}
function opHex(rgb){return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}

/* Shared semantic tokens: branding can change without changing workflow markup. */
:root{--brand-primary:#625dc3;--brand-strong:#4d49a8;--brand-surface:#eeedfa;--brand-border:#c9c5ee;--brand-sidebar:#202638;--brand-sidebar-active:#35364e;--brand-sidebar-hover:#2c3041;--brand-icon:#ff7d94;--brand-chart-1:#625dc3;--brand-chart-2:#908bd8;--brand-chart-3:#bbb8ea;--brand-chart-4:#c3a6d6}
.sidebar,.brand,.side-bottom{background:var(--brand-sidebar)!important}
.sidebar{border-color:color-mix(in srgb,var(--brand-sidebar),white 14%)!important}
.navitem.active{background:var(--brand-sidebar-active)!important;box-shadow:inset 3px 0 0 var(--brand-primary)!important}
.navitem.active svg{color:var(--brand-icon)!important;stroke:var(--brand-icon)!important}
.navitem:hover{background:var(--brand-sidebar-hover)!important}
.mode-button{background:var(--brand-sidebar-hover)!important}
.btn.primary,.on-btn.primary,.pm-btn.primary{background:var(--brand-primary)!important;border-color:var(--brand-primary)!important;color:#fff!important}
.btn.primary:hover{background:var(--brand-strong)!important}
.tab.on,.doc-tab.active,.on-tab.active,.ap68-tab.active,.pm-segment button.on{border-color:var(--brand-primary)!important;color:var(--brand-strong)!important}
.on-settings-nav button.current{background:var(--brand-surface)!important;color:var(--brand-strong)!important}
.on-settings-nav button.current strong{color:var(--brand-strong)!important}
.on-settings-nav button.current small{color:#85838e!important}
.pm-donut{background:var(--brand-primary)}
.pm-accent,.accent,.at-blue,.pm-row-arrow{color:var(--brand-primary)!important}
input[type="checkbox"],input[type="radio"]{accent-color:var(--brand-primary)}
:focus-visible{outline-color:var(--brand-primary)!important}
.op-theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.op-theme-option{border:1px solid #dedee5;border-radius:8px;background:#fff;text-align:left;padding:10px;cursor:pointer;min-width:0}
