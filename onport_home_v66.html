/* Sales support inspired dark navigation: brand and sidebar, restrained violet selection */
:root{--side:244px;--canvas:#f6f6f7;--ink:#24252a}
.sidebar{background:#111120;border-right:1px solid #303041;color:#e8e8f1}
.brand{background:#111120!important;border-bottom:1px solid #2d2d3e;height:70px;padding:16px 24px}
.logo{width:99px;height:auto;max-height:38px;object-fit:contain;object-position:left center}
.nav{padding:15px 12px}
.nav-label{color:#83849a;font-size:10px;letter-spacing:.045em}
.navitem{color:#c6c6d3;font-weight:500;border-radius:5px}
.navitem:hover{background:#25253b;color:white}
.navitem.active{background:#303048;color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--brand-primary)}
.navitem svg{stroke:currentColor}
.side-bottom{background:#111120;border-top:1px solid #303041;color:#a6a6b8}
.mode-button{background:#28283d;color:var(--brand-surface);border:1px solid #42415e;text-align:left;padding:11px 13px}
.mode-button:hover{background:#37364d}
.top{height:65px;background:#fff;border-bottom:1px solid #e7e7eb}
/* avatar: one circle, avoid double nested circular geometry */
.profile-only{width:38px;height:38px;padding:0;border:1px solid var(--theme-border);display:flex;align-items:center;justify-content:center;flex:0 0 38px;border-radius:50%;overflow:hidden;line-height:1}
.profile-only .avatar{width:100%;height:100%;margin:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--brand-surface);color:var(--brand-strong);font-weight:700;font-size:13px;line-height:1;transform:none}
/* v3 notification presentation: title, status, supporting meta, and right action */
.drawer-task .taskmeta{display:block!important;font-size:11px;color:#81818c;margin-top:6px}
.drawer-task{padding:14px 15px;gap:12px;align-items:center;background:#fff}
.drawer-task .ticon{width:38px;height:38px;flex:0 0 38px;border-radius:7px}
.drawer-task .tasktitle{font-size:13px;line-height:1.5;font-weight:700}
.drawer-task .taskact .btn{min-height:36px;min-width:100px;font-size:12px}
.drawer-task .taskbody{min-width:0;overflow-wrap:anywhere}
.drawerbody{background:#fafafb}
.switcher{background:#efeff2}
.switcher button.on{background:white;color:var(--violetDeep)}
/* compact header and cards, avoid inconsistent purple floods */
.panel{border-radius:6px}
.btn.primary{background:var(--brand-primary);border-color:var(--brand-primary)}
@media(max-width:700px){.sidebar{box-shadow:10px 0 24px #0002}.drawer-task{flex-wrap:wrap}.drawer-task .taskact{margin-left:50px;width:calc(100% - 50px)}.drawer-task .taskact .btn{width:100%}}

function apApprovalPanel(r){const who=r.state==='approved'?'承認者：管理 太郎':r.state==='returned'?'確認者：管理 太郎':'担当者の確認待ち';const action=r.state==='approved'?'承認済み':r.state==='returned'?'差戻し':r.state==='withdrawn'?'取り下げ済み':'承認待ち';return `<aside class="ap-expand-side"><h4 class="ap-expand-heading">承認状況</h4><div class="ap-approval-flow"><span class="ap-approval-dot">✓</span><div><strong>申請済み</strong><small>${apEsc(r.date)}</small></div></div><div class="ap-approval-flow"><span class="ap-approval-dot">${r.state==='pending'?'…':'✓'}</span><div><strong>${action}</strong><small>${who}</small></div></div>${r.state==='returned'?`<p class="ap-expand-note">${apEsc(r.memo||'差戻し内容を確認してください。')}</p>`:''}${r.nextStep?`<p class="ap-expand-note">次の手続き：${apEsc(r.nextStep)}</p>`:''}</aside>`}
function apHistoryDescription(r){const f=r.fields||{};let main='', sub='';
 if(r.name==='産休・育休'){main=f['出産予定日']?`出産予定 ${f['出産予定日']}`:f['育児休業開始日']?`${f['育児休業開始日']} 〜 ${f['育児休業終了日']||'未定'}`:r.target;sub='';}
 else if(r.name==='交通費申請'||r.name==='通勤手当申請'){main=[f['出発駅']||f['定期区間（開始）'],f['到着駅']||f['定期区間（終了）']].filter(Boolean).join(' → ')||r.target;const amount=Number(f['片道料金']||f['定期代']||0);sub=[r.target,amount?`${amount.toLocaleString('ja-JP')}円`:''].filter(Boolean).join(' · ');}
 else if(r.name==='有給休暇'||r.name==='特別休暇'){main=r.target;sub=[f['種別'],f['勤怠種別']].filter(Boolean).join(' · ');}
 else {main=r.target||'—';sub='';}
 return `<span class="ap-content-main">${apEsc(main)}</span>${sub?`<span class="ap-content-sub">${apEsc(sub)}</span>`:''}`;
}
function apDetailGrouped(r){const f=r.fields||{};const used=new Set();const groups=[];const take=(title,keys)=>{const fields=keys.filter(k=>f[k]!==undefined&&f[k]!==''&&f[k]!==null).map(k=>{used.add(k);return [k,f[k]]});if(fields.length)groups.push([title,fields]);};
 if(r.name==='産休・育休'){take('出産情報',['手続き','出産予定日','実際の出産日','出産区分']);take('産前休業',['産前開始予定日','産前終了予定日']);take('産後休業',['産後開始予定日','産後終了予定日']);take('育児休業',['育児休業開始日','育児休業終了日','2歳上限日','延長理由']);}
 else if(r.name==='交通費申請'||r.name==='通勤手当申請'){take('利用情報',['利用日','対象月','出発駅','到着駅','定期区間（開始）','定期区間（終了）','利用経路','交通手段']);take('金額・請求先',['片道料金','往復','定期代','請求先']);}
 else if(r.name==='有給休暇'||r.name==='特別休暇'||r.name==='休日出勤'){take('日付・期間',['取得日','開始日','終了日','休日出勤日（開始）','休日出勤日（終了）','休暇取得日（開始）','休暇取得日（終了）']);take('取得情報',['取得方法','種別','勤怠種別']);}
 take('その他',Object.keys(f).filter(k=>!used.has(k)));
 return groups.map(([title,items])=>`<div class="ap-detail-group"><h5>${apEsc(title)}</h5><dl class="ap-expand-fields">${items.map(([k,v])=>`<div><dt>${apEsc(k)}</dt><dd>${apEsc(String(v))}</dd></div>`).join('')}</dl></div>`).join('');
}
function apExpandContent(r){const actions=`<button class="btn" onclick="apDuplicate(${r.id})">複製して申請</button>${r.state==='withdrawn'?`<button class="btn primary" onclick="apReapply(${r.id})">編集して再申請</button>`:''}${r.state==='pending'?`<button class="btn" onclick="apConfirmWithdraw(${r.id})">取り下げる</button>`:''}${r.state==='returned'?`<button class="btn primary" onclick="apEditRecord(${r.id})">修正して再提出</button>`:''}${r.nextStep?`<button class="btn primary" onclick="apStartFlow('産休・育休','${r.nextStep}')">${r.nextStep}へ進む</button>`:''}`;return `<div class="ap-history-expand" id="ap-detail-${r.id}"><div class="ap-expand-inner"><section>${apDetailGrouped(r)}<div class="ap-expand-id">申請番号：${String(315680+r.id)}</div></section>${apApprovalPanel(r)}</div><div class="ap-expand-actions">${actions}</div></div>`}
function apHistoryRows(rows){return `<div class="ap-history-header"><span>申請日</span><span>申請種別</span><span>内容</span><span>ステータス</span><span></span></div>${rows.map(r=>{const expanded=apExpandedId===r.id;return `<div class="ap-history-item"><button type="button" class="ap-history-row" aria-expanded="${expanded}" aria-controls="ap-detail-${r.id}" onclick="apToggleRow(${r.id})"><span class="ap-hist-date">${apEsc(r.date)}</span><span><span class="ap-hist-name">${apEsc(r.name).replaceAll('有給','有休')}</span>${r.fields?.['手続き']?`<span class="ap-hist-stage">${apEsc(r.fields['手続き'])}</span>`:''}</span><span class="ap-hist-content">${apHistoryDescription(r)}</span><span class="ap-hist-status ${r.state}">${apEsc(r.status)}</span><svg class="ap-hist-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>${expanded?apExpandContent(r):''}</div>`}).join('')}${rows.length?'':'<div class="ap-empty">該当する申請はありません。</div>'}`}

function apps(){const visible=apVisibleRows();const names=[...new Set([...apKinds.flatMap(g=>g.names),...apRecords.map(r=>r.name)])];return `<div class="ap-page"><div class="ap-toolbar"><button class="btn primary" onclick="apStart()">＋ 新しい申請</button></div><section class="ap-panel"><div class="ap-filters"><select aria-label="申請種別で絞り込み" onchange="apKindFilter=this.value;apExpandedId=null;render()"><option value="all">すべての申請種別</option>${names.map(n=>`<option value="${apEsc(n)}" ${apKindFilter===n?'selected':''}>${apEsc(n.replaceAll('有給','有休'))}</option>`).join('')}</select><select aria-label="申請ステータスで絞り込み" onchange="apStatusFilter=this.value;apExpandedId=null;render()">${[['all','すべてのステータス'],['returned','差戻し'],['pending','承認待ち'],['approved','承認済み'],['withdrawn','取下げ済み']].map(([v,n])=>`<option value="${v}" ${apStatusFilter===v?'selected':''}>${n}</option>`).join('')}</select><span class="ap-filtercount">${visible.length}件</span></div><div class="ap-history-list">${apHistoryRows(visible)}</div></section></div>`}

function apShowDialog(title,html,buttons,sub=''){openModal(title,sub,`<div class="ap-dialog">${html}</div>`,buttons);document.body.classList.add('ap-modal-open')}
function apClose(){document.body.classList.remove('ap-modal-open');closeOverlay()}

function apPrimeTemplate(kind){const template=apCustomTemplates.find(t=>t.name===kind);if(template){if(template.body)apFormData['本文']=template.body;if(template.note)apFormData['備考']=template.note}if(kind==='産休・育休'&&!apFormData['手続き'])apFormData['手続き']='産休予定'}
function apStart(kind){apAutoEdited=new Set();apEditId=null;apKind=kind||'有給休暇';apFormData={};apLeaveMode='単日取得';apPrimeTemplate(apKind);apShowForm()}
function apStartFlow(kind,step){apAutoEdited=new Set();apEditId=null;apKind=kind;apFormData={'手続き':step};apLeaveMode='単日取得';apPrimeTemplate(apKind);apInheritFlow(step);apShowForm()}
function apDuplicate(id){apAutoEdited=new Set();const r=apRecords.find(x=>x.id===id);if(!r)return;apEditId=null;apKind=r.name;apFormData={...r.fields};apLeaveMode=apFormData['取得方法']||((apFormData['終了日']&&apFormData['終了日']!==apFormData['開始日'])?'連日取得':'単日取得');apShowForm()}
function apPickKind(kind){apAutoEdited=new Set();apKind=kind;apFormData={};apLeaveMode='単日取得';apPrimeTemplate(kind);apShowForm()}
let apAutoEdited=new Set();
function apDateShift(value,days){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return '';const [y,m,d]=value.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return '';dt.setUTCDate(dt.getUTCDate()+days);return dt.toISOString().slice(0,10)}
function apDateYear(value,years,subtractDay=false){if(!value)return '';const [y,m,d]=value.split('-').map(Number);const end=new Date(Date.UTC(y+years,m-1,d));if(end.getUTCMonth()!==m-1)end.setUTCDate(0);if(subtractDay)end.setUTCDate(end.getUTCDate()-1);return end.toISOString().slice(0,10)}
function apCalcDates(changedKey){if(apKind!=='産休・育休')return;const f=apFormData,flow=f['手続き']||'産休予定',due=f['出産予定日'],actual=f['実際の出産日'];const set=(k,v)=>{if(!apAutoEdited.has(k)&&v)f[k]=v};
 if(flow.startsWith('産休')){
   if(due){set('産前開始予定日',apDateShift(due,f['出産区分']==='多胎'?-98:-42));set('産前終了予定日',due);}
   const base=(flow==='産休本申請'?actual||due:due);
   if(base){set('産後開始予定日',apDateShift(base,1));set('産後終了予定日',apDateShift(base,56));}
   if(flow==='産休本申請'&&actual)set('産前終了予定日',actual);
 } else {
   const base=actual||due;
   if(base){set('育児休業開始日',apDateShift(base,56));set('2歳上限日',apDateYear(base,2,true));if(flow!=='育休延長')set('育児休業終了日',apDateYear(base,1,true));}
 }
}
function apSet(key,value){apFormData[key]=value;if(apKind==='産休・育休'){
 const outputs=['産前開始予定日','産前終了予定日','産後開始予定日','産後終了予定日','育児休業開始日','育児休業終了日','2歳上限日'];
 if(outputs.includes(key)){if(value)apAutoEdited.add(key);else apAutoEdited.delete(key)}
 if(['出産予定日','実際の出産日','出産区分'].includes(key))apCalcDates(key);
}}
function apInputAuto(label,type='date',wide=false,locked=false){const edited=apAutoEdited.has(label);const value=apFormData[label]||'';return `<div class="ap-field ${wide?'full':''}"><label>${label}${!locked?` <span class="ap-auto-label ${edited?'manual':''}">${edited?'手動変更':'自動計算'}</span>`:' <span class="ap-auto-label locked">引き継ぎ</span>'}</label><input type="${type}" value="${apEsc(value)}" ${locked?'readonly':''} oninput="apSet('${label}',this.value)" onchange="apSet('${label}',this.value);apShowForm()"><div class="ap-auto-actions">${edited?`<button type="button" onclick="apAutoEdited.delete('${label}');apCalcDates('reset');apShowForm()">自動計算に戻す</button>`:''}</div></div>`}

function apChangeLeaveMode(mode){apLeaveMode=mode;apFormData['取得方法']=mode;if(mode==='単日取得')delete apFormData['終了日'];apFormData['勤怠種別']='全日';apShowForm()}
function apShowForm(){if(apKind==='産休・育休')apCalcDates('display');apShowDialog('新しい申請',apCreator(),`<button class="btn" onclick="apClose()">キャンセル</button><button class="btn primary" onclick="apReview()">内容を確認</button>`,apEditId?'差戻し申請を修正':'')}
function apSelect(label,options,wide=false){return `<div class="ap-field ${wide?'full':''}"><label>${label}</label><select onchange="apSet('${label}',this.value);${['申請区分','休暇区分','交通手段','出産区分','利用区分','取得単位','勤怠種別','請求先','種別','休暇種別'].includes(label)?'apShowForm()':''}">${options.map((x,i)=>`<option ${String(apFormData[label]||options[0])===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function apInput(label,type='text',placeholder='',wide=false){return `<div class="ap-field ${wide?'full':''}"><label>${label}</label><input type="${type}" value="${apEsc(apFormData[label])}" placeholder="${placeholder}" oninput="apSet('${label}',this.value)" onchange="${['出発駅','到着駅','定期区間（開始）','定期区間（終了）'].includes(label)?'apShowForm()':(apKind==='産休・育休'&&['出産予定日','実際の出産日'].includes(label)?'apShowForm()':'')}"></div>`}
function apArea(label='備考',placeholder=''){return `<div class="ap-field full"><label>${label}（任意）</label><textarea placeholder="${placeholder}" oninput="apSet('${label}',this.value)">${apEsc(apFormData[label])}</textarea></div>`}
function apFile(label='添付ファイル'){return `<div class="ap-field full"><label>${label}</label><input type="file" onchange="apSet('${label}',this.files[0]?.name||'')"><span class="ap-hint">${apEsc(apFormData[label]||'')}</span></div>`}

function apRouteCandidates(){const from=apFormData['出発駅']||apFormData['定期区間（開始）']||'';const to=apFormData['到着駅']||apFormData['定期区間（終了）']||'';if(!(from&&to))return [];const seed=Math.max(190,(from.length*13)+(to.length*11)+140);return [{line:`${from} → ${to}（JR山手線）`,detail:`最短 ${from} → 渋谷 → ${to}`,fare:seed},{line:`${from} → ${to}（東京メトロ）`,detail:`乗換1回 ${from} → 表参道 → ${to}`,fare:seed+20},{line:`${from} → ${to}（JR＋私鉄）`,detail:`通勤しやすい経路 ${from} → 新宿 → ${to}`,fare:seed+40}]}
function apChooseRoute(i){const r=apRouteCandidates()[i];if(!r)return;apFormData['利用経路']=r.line;if(apKind==='通勤手当申請'&&(apFormData['申請区分']||'定期')==='定期')apFormData['定期代']=String(r.fare*20);else apFormData['片道料金']=String(r.fare);apShowForm()}
function apRoutePanel(){const from=apFormData['出発駅']||apFormData['定期区間（開始）'];const to=apFormData['到着駅']||apFormData['定期区間（終了）'];const routes=apRouteCandidates();if(!(from&&to))return `<div class="ap-route-inline"><h4>経路候補</h4><div class="ap-route-empty">出発駅と到着駅を入れると、この画面内で候補経路と仮の料金を表示します。</div></div>`;return `<div class="ap-route-inline"><h4>経路候補</h4><div class="ap-route-list">${routes.map((r,i)=>`<button type="button" class="ap-route-option" onclick="apChooseRoute(${i})"><strong>${apEsc(r.line)}</strong><small>${apEsc(r.detail)}</small><span class="fare">${r.fare.toLocaleString('ja-JP')}円${apKind==='通勤手当申請'&&(apFormData['申請区分']||'定期')==='定期'?' / 月額イメージ':''}</span></button>`).join('')}</div></div>`}
function apFlowPicker(){
 const current=apFormData['手続き']||'産休予定';
 const isMaternity=current.startsWith('産休');
 const group=isMaternity?'産休':'育休';
 const choices=isMaternity?[['産休予定','予定'],['産休本申請','本申請']]:[['育休予定登録','予定登録'],['育休申請','仮申請'],['育休延長','延長申請'],['育休本申請','本申請']];
 return `<div class="ap-flow-control"><div class="ap-flow-primary" role="tablist" aria-label="産休・育休の切り替え"><button type="button" role="tab" aria-selected="${isMaternity}" class="${isMaternity?'on':''}" onclick="apChooseFlowGroup('産休')">産休</button><button type="button" role="tab" aria-selected="${!isMaternity}" class="${!isMaternity?'on':''}" onclick="apChooseFlowGroup('育休')">育休</button></div><div class="ap-flow-secondary" role="group" aria-label="${group}の手続き">${choices.map(([v,label])=>`<button type="button" class="${current===v?'on':''}" aria-pressed="${current===v}" onclick="apSet('手続き','${v}');apInheritFlow('${v}');apShowForm()">${label}</button>`).join('')}</div></div>`;
}
function apInheritFlow(step){const records=apRecords.filter(r=>r.name==='産休・育休'&&r.state==='approved').reverse();const source=records.find(r=>step.startsWith('産休')?String(r.fields['手続き']||'').startsWith('産休'):String(r.fields['手続き']||'').startsWith('育休'));if(!source)return;['出産予定日','出産区分','実際の出産日','産前開始予定日','産前終了予定日','産後開始予定日','産後終了予定日','育児休業開始日','育児休業終了日'].forEach(k=>{if(!apFormData[k]&&source.fields[k])apFormData[k]=source.fields[k]});apCalcDates('inherit')}
function apChooseFlowGroup(group){
 const current=apFormData['手続き']||'産休予定';
 if((group==='産休'&&current.startsWith('産休'))||(group==='育休'&&current.startsWith('育休')))return;
 apSet('手続き',group==='産休'?'産休予定':'育休予定登録');
 apInheritFlow(apFormData['手続き']);apShowForm();
}
function apFormFields(k){
 const pair=(a,b)=>`<div class="ap-date-pair">${a}${b||''}</div>`;
 const section=(html)=>`<div class="ap-logical-group"><div class="ap-fields">${html}</div></div>`;
 const modePicker=(value,callback)=>`<div class="ap-field full ap-unit"><label>取得単位</label><div class="ap-inline-switch"><button type="button" class="${value==='単日取得'?'on':''}" onclick="${callback}('単日取得')">単日</button><button type="button" class="${value==='連日取得'?'on':''}" onclick="${callback}('連日取得')">連日</button></div></div>`;
 const dates=(mode)=>pair(apInput(mode==='単日取得'?'取得日':'開始日','date'),mode==='連日取得'?apInput('終了日','date'):'');
 const attendanceType=(mode)=>mode==='連日取得'?'':apSelect('勤怠種別',['全日','AM半休','PM半休']);
 const leave=(types,key='種別')=>{const mode=apLeaveMode;return section(modePicker(mode,'apChangeLeaveMode')+dates(mode)+apSelect(key,types)+attendanceType(mode))+apArea()+apFile();};
 if(k==='有給休暇')return `<div class="ap-leave-balance"><div><span>通常有休</span><strong>0日分</strong><small>申請中 0日分</small></div><div><span>前借り有休</span><strong>0日分</strong><small>次回付与予定は未登録</small></div><div><span>夏季休暇</span><strong>0日分</strong><small>申請中 0日分</small></div></div>`+leave(['通常','前借り','夏季休暇']);
 if(k==='特別休暇')return leave(['自社都合','客先都合']);
 if(k==='欠勤・その他の休暇')return leave(['欠勤','夏季休暇','慶弔休暇','子の看護等休暇','介護休暇','生理休暇'],'休暇種別');

function atMins(v){if(!v||!v.includes(':'))return 0;let [h,m]=v.split(':').map(Number);return h*60+m}
function atFmt(n){let neg=n<0;n=Math.abs(n);return (neg?'-':'')+Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function atSubOverlap(d,x){const a=atMins(x.start),b=atMins(x.end),ms=atMins(d.start),me=atMins(d.end);let overlap=Math.max(0,Math.min(b,me)-Math.max(a,ms));for(const br of d.breaks||[]){overlap-=Math.max(0,Math.min(b,me,atMins(br.end))-Math.max(a,ms,atMins(br.start)))}return Math.max(0,overlap)}
function atNet(d){const br=(d.breaks||[]).reduce((n,x)=>n+Math.max(0,atMins(x.end)-atMins(x.start)),0);const span=Math.max(0,atMins(d.end)-atMins(d.start)-br);const deducted=d.subs.filter(s=>s.type==='internal'||s.type==='deduct').reduce((n,x)=>n+atSubOverlap(d,x),0);const mainExtra=d.subs.filter(s=>s.type==='main'||s.type==='extra').reduce((n,x)=>n+Math.max(0,atMins(x.end)-atMins(x.start)),0);return Math.max(0,span-deducted)+mainExtra}
function atSub(d){return d.subs.filter(x=>x.type==='internal').reduce((n,x)=>n+Math.max(0,atMins(x.end)-atMins(x.start)),0)}
function atStat(){return attDays.reduce((a,d)=>({main:a.main+atNet(d),sub:a.sub+atSub(d),overtime:a.overtime+Math.max(0,atNet(d)+atSub(d)-480)}),{main:0,sub:0,overtime:0})}

"at-metrics"><div class="at-metric-line">${[['有給休暇','0日',''],['特別休暇','0日',''],['休日出勤','0日',''],['総労働時間',atFmt(stat.main+stat.sub),'at-blue'],['メイン',atFmt(stat.main),''],['サブ',atFmt(stat.sub),''],['残業',atFmt(stat.overtime),'at-red']].map(x=>`<div class="at-metric"><small>${x[0]}</small><strong class="${x[2]}">${x[1]}</strong></div>`).join('')}</div><details class="at-details"><summary>法定時間区分・集計の内訳</summary><div class="at-details-grid at-detail-list">${[['日次時間外（1日8時間超）','15.5h'],['週次時間外（週40時間超過・日次分を除く）','0h'],['深夜（22:00〜翌5:00）','0h'],['法定休日労働（法定休日の勤務）','0h'],['月60時間超過（時間外の月60時間超過分）','0h'],['36協定照合（時間外＋法定休日労働）','15.5h'],['休日出勤（振替・代休）','0h']].map(x=>`<div class="at-detail-stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div></details></section><div class="at-alert"><span><b>10/1 の休憩時間が不足しています。</b></span><button class="textlink" onclick="atOpenDay(1)">修正する →</button></div><section class="at-sheet"><div class="at-table-scroll"><table class="at-table"><thead><tr><th class="at-date-head">日付</th><th class="at-dow-head">曜日</th><th>出勤</th><th>退勤</th><th>休憩</th><th class="at-desktop-col">メイン</th><th class="at-desktop-col">サブ</th><th class="at-desktop-col">残業</th><th class="at-desktop-col">備考</th><th>状況</th></tr></thead><tbody>${attDays.map(d=>{let err=d.d===1,week=d.day===0||d.day===6,app=atDayApplications[d.d]||[];return `<tr onclick="atOpenDay(${d.d})" class="${err?'bad-row':week?'weekend':''}"><td class="at-date-cell"><span class="at-day">${d.d}</span></td><td class="at-dow-cell"><span class="at-dow">${'日月火水木金土'[d.day]}</span></td><td><input class="at-time" type="time" lang="ja-JP" step="${atMinuteStep*60}" value="${d.start}" aria-label="${d.d}日 出勤" onclick="event.stopPropagation();atPickTime(this)" onchange="atChange(${d.d},'start',this.value)" ${week?'disabled':''}></td><td><input class="at-time" type="time" lang="ja-JP" step="${atMinuteStep*60}" value="${d.end}" aria-label="${d.d}日 退勤" onclick="event.stopPropagation();atPickTime(this)" onchange="atC function atOpenOCR(){openModal('客先勤怠表を取り込む','',`<div class="ocr-upload-help">客先の勤怠表をアップロードすると、今月の勤務時間と照合できます。</div><div class="ocr-upload-drop" onclick="document.getElementById('ocrDemoFiles').click()"><span class="ocr-upload-icon">⇧</span><strong>PDF・画像を選ぶ</strong><small>または、ここにドラッグ＆ドロップ</small><small>PDF / PNG / JPEG / WebP・最大10ページ</small></div><input id="ocrDemoFiles" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf" style="display:none" onchange="ocrDemoSelected(this)"><div id="ocrDemoFileList" class="ocr-upload-files">ファイルはまだ選択されていません</div><div class="ocr-demo-divider"><span>モックアップの操作</span></div><button class="btn ocr-demo-shortcut" onclick="ocrDemoFinish()">サンプルの勤怠表で取込結果を見る →</button>`,`<button class="btn" onclick="closeOverlay()">キャンセル</button><button class="btn primary" id="ocrDemoRun" disabled onclick="ocrDemoFinish()">読み取って比較する →</button>`);const drop=document.querySelector('.ocr-upload-drop');if(drop){drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragging')});drop.addEventListener('dragleave',()=>drop.classList.remove('dragging'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('dragging');ocrDemoSelected({files:e.dataTransfer.files})})}}
function ocrDemoSelected(input){const files=Array.from(input.files||[]);const list=document.getElementById('ocrDemoFileList'),run=document.getElementById('ocrDemoRun');if(list)list.innerHTML=files.length?files.map(f=>`<div class="ocr-upload-file">${anEsc(f.name)}</div>`).join(''):'ファイルはまだ選択されていません';if(run)run.disabled=!files.length}
function ocrDemoFinish(){closeOverlay();view='ocr';atOCRFilter='needs';render();window.scrollTo(0,0)}
function ocrPage(){const unresolved=atOcrData.filter(x=>!x.decision).length;const extras=[1,2,4,5,6,9,10,12,13,14,15,17,18,19,20];const rows=atOCRFilter==='all'?[...atOcrData.map(x=>({...x,matching:false})),...extras.map(id=>({id,old:'09:00–18:00',ocr:'09:00–18:00',matching:true}))].sort((a,b)=>a.id-b.id):atOcrData.filter(x=>!x.decision);return `<div class="at-wrap ocr-redesign"><section class="at-ocr-main"><div class="at-ocr-summaryhead"><button class="btn" onclick="navigate('attendance')">← 勤怠表へ戻る</button><span>2026年10月</span></div><div class="at-ocr-summaryline"><div><strong>取込結果</strong><span>20日分を読み取り・${unresolved}日を確認</span></div><button class="btn" onclick="atOCRBulk()">時刻の差分を一括反映</button></div><div class="at-ocr-tabletools"><div class="switcher"><button class="${atOCRFilter==='needs'?'on':''}" onclick="atOCRFilter='needs';render()">要確認 ${unresolved}</button><button class="${atOCRFilter==='all'?'on':''}" onclick="atOCRFilter='all';render()">すべて 20日</button></div></div><div class="ocr-list"><div class="ocr-headrow"><span>日付</span><span>現在の勤怠</span><span>客先の勤怠</span><span>反映方法</span></div>${rows.map(r=>`<div class="ocr-row ${r.matching?'matching':''}"><div class="ocr-date"><strong>10/${r.id}</strong>${r.kind==='check'?'<small class="ocr-warning">日付確認</small>':r.matching?'<small>一致</small>':r.decision?'<small>選択済み</small>':'<small class="ocr-warning">差分あり</small>'}</div><div class="ocr-times"><span class="ocr-mobile-label">現在</span><strong>${r.old}</strong></div><div class="ocr-times"><span class="ocr-mobile-label">客先</span><strong>${r.ocr}</strong></div><div class="ocr-decision">${r.matching?'<span class="ocr-equal">✓ 一致</span>':r.kind==='check'?`<button class="at-choice ${r.decision==='date'?'on':''}" onclick="atOcrChoose(${r.id},'date')">10/${r.id}で確定</button>`:`<div class="ocr-choice-group"><button class="at-choice ${r.decision==='keep'?'on':''}" onclick="atOcrChoose(${r.id},'keep')">現在のまま</button><button class="at-choice ${r.decision==='ocr'?'on':''}" onclick="atOcrChoose(${r.id},'ocr')">客先を反映</button><button class="at-choice ${r.manualOpen?'on':''}" onclick="atOcrToggleManual(${r.id})">手入力で修正</button></div>${r.manualOpen?`<div class="ocr-manual-inline"><span class="ocr-mini-label">反映</span><div class="ocr-inline-times"><input aria-label="10月${r.id}日の出勤時刻" type="time" value="${r.manualStart||r.old.slice(0,5)}" onchange="atOcrEdit(${r.id},'start',this.value)"><span>–</span><input aria-label="10月${r.id}日の退勤時刻" type="time" value="${r.manualEnd||r.old.slice(6,11)}" onchange="atOcrEdit(${r.id},'end',this.value)"></div></div>`:''}`}</div></div>`).join('')}${rows.length?'':'<div class="empty">確認が必要な日はありません。</div>'}</div></section><div class="at-ocr-foot"><strong>${unresolved?`残り${unresolved}日`:'確認完了'}</strong><button class="btn primary" ${unresolved?'disabled':''} onclick="atOCRFinish()">勤怠表に反映する</button></div></div>`}
function atOcrToggleManual(id){const row=atOcrData.find(x=>x.id===id);if(!row)return;row.manualOpen=!row.manualOpen;render()}
function atOcrEdit(id,field,value){const row=atOcrData.find(x=>x.id===id);if(!row)return;row[field==='start'?'manualStart':'manualEnd']=value;row.decision='manual';row.manualOpen=true;render()}
function atOcrChoose(id,v){const row=atOcrData.find(x=>x.id===id);if(!row)return;row.decision=v;row.manualOpen=false;render()}
function atOCRBulk(){atOcrData.filter(x=>x.kind==='diff').forEach(x=>x.decision='ocr');render()}
function atOCRFinish(){atOcrData.filter(x=>x.decision==='ocr'||x.decision==='manual').forEach(r=>{let d=attDays[r.id-1];if(r.decision==='manual'){d.start=r.manualStart||r.old.slice(0,5);d.end=r.manualEnd||r.old.slice(6,11)}else{d.end=r.id===3?'19:15':r.id===7?'12:35':d.end}d.changed=true});navigate('attendance');atToast('OCRの確認内容を反映しました')}

function mbDownloadCsv(){const v=['社員番号,氏名,所属,拠点,入社日,区分,担当営業,権限,公開,自己紹介,スキル,興味','EMP999,山田 花子,開発事業部,東京,2026-10-01,エンジニア,野村,一般,公開,よろしくお願いします,Java/SQL,読書'];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+v.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='onport_members_template.csv';a.click();URL.revokeObjectURL(a.href)}
function mbReadCsv(input){const f=input.files[0];if(!f)return;f.text().then(t=>{document.querySelector('#mbBulkText').value=t.replace(/^\ufeff/,'')})}
function mbImportCsv(){const text=document.querySelector('#mbBulkText').value.trim(),lines=text.split(/\r?\n/).filter(Boolean);if(lines.length<2){atToast('CSVのデータ行がありません');return}let count=0;for(const line of lines.slice(1)){const x=line.split(',');if(x.length<2||!x[0]||!x[1])continue;let p=mbPeople.find(y=>y.id===x[0]);if(!p){p={id:x[0],bio:'',skills:[],topics:[],published:true};mbPeople.push(p)}Object.assign(p,{name:x[1],team:x[2]||'',site:x[3]||'',join:x[4]||'',type:x[5]||'エンジニア',rep:x[6]||'',role:x[7]||'一般',published:x[8]!=='非公開',bio:x[9]||'',skills:(x[10]||'').split('/').filter(Boolean),topics:(x[11]||'').split('/').filter(Boolean)});count++}mbAdminTab='list';render();atToast(`${count}名のデータを反映しました`)}


let mbSelectedTag='',cmTab='timeline',cmAdminTab='communities',cmCurrent=1,cmEditingPost=null;
function mbTagButton(t){return `<button type="button" class="mb-pill ${mbSelectedTag===t?'active':''}" onclick="event.stopPropagation();mbSelectedTag=mbSelectedTag===${JSON.stringify(t)}?'':${JSON.stringify(t)};render()">${mbEsc(t)}</button>`}
function mbMatches(p){return (mbTeam==='すべての所属'||p.team===mbTeam)&&(mbSite==='すべての拠点'||p.site===mbSite)&&(!mbSelectedTag||[...p.skills,...p.topics].includes(mbSelectedTag))&&[p.name,p.team,p.site,p.bio,...p.skills,...p.topics].join(' ').toLowerCase().includes(mbQuery.trim().toLowerCase())}
function members(){const filtered=mbPeople.filter(p=>p.published&&mbMatches(p));const tags=[...new Set(mbPeople.filter(p=>p.published).flatMap(p=>[...p.skills,...p.topics]))].sort((a,b)=>a.localeCompare(b,'ja'));return `<div class="mb-page"><div class="mb-tools"><div class="mb-search"><input type="search" value="${mbEsc(mbQuery)}" placeholder="名前・自己紹介・スキル・趣味で検索" oninput="mbQuery=this.value;mbUpdateList()"><select class="mb-select" onchange="mbTeam=this.value;mbUpdateList()">${mbOptions(['すべての所属',...new Set(mbPeople.map(p=>p.team))],mbTeam)}</select><select class="mb-select" onchange="mbSite=this.value;mbUpdateList()">${mbOptions(['すべての拠点',...new Set(mbPeople.map(p=>p.site))],mbSite)}</select></div><div class="mb-count" id="mbCount">${filtered.length}名</div></div><div class="mb-filter-tags">${tags.slice(0,16).map(mbTagButton).join('')}${mbSelectedTag?'<button class="mb-mini-link" onclick="mbSelectedTag=\'\';render()">解除 ×</button>':''}</div><div class="mb-list"><div class="mb-grid mb-head"><span>メンバー</span><span>所属・拠点</span><span>スキル・好きなこと</span><span></span></div><div id="mbRows">${mbMemberRows(filtered)}</div></div></div>`}
function mbMemberRows(filtered){filtered=[...filtered].sort((a,b)=>(a.id==='EMP001'?-1:b.id==='EMP001'?1:0));return filtered.map(p=>`<div class="mb-person mb-grid ${p.id==='EMP001'?'mb-self':''}" onclick="mbProfile('${p.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')mbProfile('${p.id}')"><span class="mb-name">${mbAvatar(p)}<span><strong>${mbEsc(p.name)} ${p.id==='EMP001'?'<span class="mb-you">自分</span>':''}</strong><small>${mbEsc(p.type)}</small></span></span><span class="mb-team">${mbEsc(p.team)}<br><span class="mb-share">${mbEsc(p.site)}</span></span><span class="mb-tags">${[...p.skills.slice(0,2),...p.topics.slice(0,2)].map(mbTagButton).join('')}</span><span class="mb-role">${p.id==='EMP001'?'<button class="btn" onclick="event.stopPropagation();mbEditSelf()">編集</button>':'詳しく見る →'}</span></div>`).join('')||'<div class="mb-empty">条件に一致するメンバーがいません。</div>'}
function mbTagInput(id,items,title){return `<label>${title}<div class="mb-tags-edit" id="${id}Wrap">${items.map(t=>`<span class="mb-pill">${mbEsc(t)}<button class="mb-tagremove" type="button" onclick="this.parentElement.remove()" aria-label="削除">×</button></span>`).join('')}<input id="${id}" placeholder="入力してEnterで追加" onkeydown="mbEnterTag(event,'${id}')"></div></label>`}
function mbEnterTag(ev,id){if(ev.key!=='Enter'&&ev.key!==',')return;ev.preventDefault();const v=ev.target.value.trim().replace(/、$/,'');if(!v)return;const wrap=document.querySelector('#'+id+'Wrap');if([...wrap.querySelectorAll('.mb-pill')].some(x=>x.textContent.replace('×','').trim()===v)){ev.target.value='';return}ev.target.insertAdjacentHTML('beforebegin',`<span class="mb-pill">${mbEsc(v)}<button class="mb-tagremove" type="button" onclick="this.parentElement.remove()">×</button></span>`);ev.target.value=''}
function mbCollectTags(id){const wrap=document.querySelector('#'+id+'Wrap');const tags=[...wrap.querySelectorAll('.mb-pill')].map(x=>x.textContent.replace('×','').trim());const extra=document.getElementById(id).value.trim();return [...new Set([...tags,...mbSplit(extra)])]}
function mbEditSelf(){const p=mbPeople.find(x=>x.id==='EMP001');openModal('プロフィールの編集','',`<div class="mb-edit"><section><h3>自己紹介</h3><label>紹介文<textarea id="mbSelfBio">${mbEsc(p.bio)}</textarea></label></section><section><h3>得意なこと</h3>${mbTagInput('mbSelfSkills',p.skills,'スキル')}</section><section><h3>好きなこと</h3>${mbTagInput('mbSelfTopics',p.topics,'趣味・興味')}</section></div>`,`<button class="btn" onclick="mbProfile('EMP001')">戻る</button><button class="btn primary" onclick="mbSaveSelf()">保存する</button>`)}
function mbSaveSelf(){const p=mbPeople.find(x=>x.id==='EMP001');p.bio=document.querySelector('#mbSelfBio').value;p.skills=mbCollectTags('mbSelfSkills');p.topics=mbCollectTags('mbSelfTopics');closeOverlay();render();atToast('プロフィールを更新しました')}
function mbEditAdmin(id){const p=id?mbPeople.find(x=>x.id===id):{id:'',name:'',team:'',site:'本社',join:'',type:'エンジニア',role:'一般',bio:'',skills:[],topics:[],rep:'',published:true};mbEditingId=id||null;openModal(id?'メンバーの編集':'メンバーを登録','',`<div class="mb-edit"><section><h3>基本情報</h3><div class="mb-formline two"><label>社員番号<input id="mbId" value="${mbEsc(p.id)}" ${id?'readonly':''}></label><label>氏名<input id="mbName" value="${mbEsc(p.name)}"></label></div><div class="mb-formline two"><label>所属<input id="mbDept" value="${mbEsc(p.team)}"></label><label>拠点<select id="mbSiteVal">${mbOptions(['関東','関西','中部','九州','他地域'],p.site)}</select></label></div><div class="mb-formline"><label>入社日<input type="date" id="mbJoin" value="${mbEsc(p.join)}"></label></div></section><section><h3>雇用・管理</h3><div class="mb-formline two"><label>区分<select id="mbType">${mbOptions(['エンジニア','内勤'],p.type)}</select></label><label>担当営業<input id="mbRep" value="${mbEsc(p.rep)}"></label></div><div class="mb-formline two"><label>システム権限<select id="mbRole">${mbOptions(['一般','管理者'],p.role)}</select></label><label style="display:flex;align-items:center;flex-direction:row;gap:8px;margin-top:18px"><input type="checkbox" id="mbPublish" style="width:auto" ${p.published?'checked':''}>一覧に公開</label></div></section><section><h3>公開プロフィール</h3><div class="mb-formline"><label>自己紹介<textarea id="mbBio">${mbEsc(p.bio)}</textarea></label></div><div class="mb-formline">${mbTagInput('mbSkills',p.skills,'スキル')}</div><div class="mb-formline">${mbTagInput('mbTopics',p.topics,'趣味・興味')}</div></section></div>`,`<button class="btn" onclick="closeOverlay()">キャンセル</button><button class="btn primary" onclick="mbSaveAdmin()">${id?'保存する':'登録する'}</button>`)}
function mbSaveAdmin(){const val=id=>document.querySelector('#'+id)?.value||'',id=val('mbId').trim(),name=val('mbName').trim();if(!id||!name){atToast('社員番号と氏名を入力してください');return}if(!mbEditingId&&mbPeople.some(x=>x.id===id)){atToast('社員番号が重複しています');return}let p=mbEditingId?mbPeople.find(x=>x.id===mbEditingId):{id};Object.assign(p,{id,name,team:val('mbDept'),site:val('mbSiteVal'),join:val('mbJoin'),type:val('mbType'),rep:val('mbRep'),role:val('mbRole'),bio:val('mbBio'),skills:mbCollectTags('mbSkills'),topics:mbCollectTags('mbTopics'),published:document.querySelector('#mbPublish').checked});if(!mbEditingId)mbPeople.unshift(p);closeOverlay();render();atToast(mbEditingId?'メンバー情報を更新しました':'メンバーを登録しました')}
let cmGroups=[{id:1,name:'フロントエンド勉強会',type:'勉強系',founder:'田中 花子',description:'React・Vueなどの知見を持ち寄る勉強会。',members:12,joined:true,status:'approved',points:true,multiplier:1},{id:2,name:'写真部',type:'趣味系',founder:'佐藤 美咲',description:'日常の写真を共有。フォトウォークも開催します。',members:8,joined:false,status:'approved',points:true,multiplier:1},{id:3,name:'ランニング部',type:'趣味系',founder:'鈴木 一郎',description:'無理なく走ってリフレッシュ。',members:6,joined:false,status:'approved',points:false,multiplier:1},{id:4,name:'ボードゲーム同好会',type:'交流系',founder:'中村 葵',description:'初心者も歓迎です。',members:0,joined:false,status:'pending',points:true,multiplier:1}];

function cmGroup(){return cmGroups.find(x=>x.id===cmCurrent)||cmGroups[0]}
function community(){let g=cmGroup(),groups=cmGroups.filter(x=>x.status==='approved');return `<div class="cm-page"><div class="cm-actions"><div class="cm-tabs"><button class="${cmTab==='timeline'?'on':''}" onclick="cmTab='timeline';render()">タイムライン</button><button class="${cmTab==='events'?'on':''}" onclick="cmTab='events';render()">イベント</button><button class="${cmTab==='discover'?'on':''}" onclick="cmTab='discover';render()">探す</button></div><button class="btn" onclick="cmNewGroup()">＋ コミュニティを作る</button></div>${cmTab==='discover'?`<section class="cm-main"><div class="cm-mainheader"><h2>コミュニティを探す</h2></div>${groups.map(c=>`<div class="cm-listrow"><div><strong>${mbEsc(c.name)}</strong><small>${mbEsc(c.type)} · ${c.members}人 · ${mbEsc(c.description)}</small></div><button class="btn" onclick="cmCurrent=${c.id};cmTab='timeline';render()">見る →</button></div>`).join('')}</section>`:`<div class="cm-layout"><aside class="cm-side">${groups.map(c=>`<button class="${cmCurrent===c.id?'on':''}" onclick="cmCurrent=${c.id};render()">${mbEsc(c.name)}</button>`).join('')}</aside><section class="cm-main"><div class="cm-mainheader"><div class="cm-actions"><div><h2>${mbEsc(g.name)}</h2><span class="cm-mini">${mbEsc(g.description)} · ${g.members}人</span></div><button class="btn ${g.joined?'':'primary'}" onclick="cmJoin(${g.id})">${g.joined?'参加中':'参加する'}</button></div></div>${cmTab==='timeline'?`${g.joined?`<div class="cm-composer"><textarea id="cmPostText" placeholder="このコミュニティに投稿する"></textarea><div class="cm-actions"><label class="cm-mini">画像を添付 <input type="file" id="cmPostImage" accept="image/*"></label><button class="btn primary" onclick="cmSubmitPost()">投稿する</button></div></div>`:''}<div class="cm-rows">${cmPosts.filter(x=>x.group===g.id&&!x.deleted).map(cmPostRow).join('')||'<p class="mb-empty">投稿はまだありません。</p>'}</div>`:`<div>${g.joined?'<div style="padding:16px 20px"><button class="btn primary" onclick="cmNewEvent()">＋ イベントを申請</button></div>':''}${cmEvents.filter(e=>e.group===g.id&&e.status==='approved').map(e=>`<div class="cm-listrow"><div><strong>${mbEsc(e.name)}</strong><small>${mbEsc(e.when.replace('T',' '))} · ${mbEsc(e.place)}</small></div><button class="btn" onclick="cmEventDetail(${e.id})">詳細を見る</button></div>`).join('')||'<p class="mb-empty">イベントはまだありません。</p>'}</div>`}</section></div>`}</div>`}
function cmPostRow(p){return `<article class="cm-post"><div class="cm-post-head"><span class="mb-avatar sm">${mbEsc(p.name[0])}</span><strong>${mbEsc(p.name)}</strong><span class="cm-mini">${p.time}</span></div><p>${mbEsc(p.text)}</p>${p.image?`<img class="cm-post-image" src="${p.image}" alt="投稿画像">`:''}<div class="cm-post-actions"><button onclick="cmLike(${p.id})">${p.liked?'♥':'♡'} ${p.likes}</button><button onclick="cmReply(${p.id})">コメント ${p.comments.length}</button>${p.name==='管理 太郎'?`<button onclick="cmEditPost(${p.id})">編集</button><button onclick="cmDeletePost(${p.id})">削除</button>`:''}</div>${p.comments.map(c=>`<div class="cm-thread">${mbEsc(c)}</div>`).join('')}</article>`}
function cmJoin(id){const g=cmGroups.find(x=>x.id===id);g.joined=!g.joined;g.members+=g.joined?1:-1;render()}
function cmSubmitPost(){const t=document.getElementById('cmPostText')?.value.trim();const file=document.getElementById('cmPostImage')?.files[0];if(!t&&!file){atToast('投稿内容を入力してください');return}const post={id:Date.now(),group:cmCurrent,name:'管理 太郎',time:'たった今',text:t,likes:0,liked:false,comments:[],deleted:false};cmPosts.unshift(post);if(file){const reader=new FileReader();reader.onload=()=>{post.image=reader.result;render()};reader.readAsDataURL(file)}else render()}
function cmLike(id){const p=cmPosts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;render()}
function cmReply(id){openModal('コメントを書く','',`<div class="cm-modal"><textarea id="cmReplyText" placeholder="コメントを入力"></textarea></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button><button class="btn primary" onclick="cmSendReply(${id})">投稿する</button>`)}
function cmSendReply(id){const v=document.getElementById('cmReplyText').value.trim();if(!v)return;cmPosts.find(x=>x.id===id).comments.push('管理 太郎：'+v);closeOverlay();render()}
function cmEditPost(id){const p=cmPosts.find(x=>x.id===id);openModal('投稿を編集','',`<div class="cm-modal"><textarea id="cmEditText">${mbEsc(p.text)}</textarea></div>`,`<button class="btn" onclick="closeOverlay()">キャンセル</button><button class="btn primary" onclick="cmSaveEdit(${id})">保存する</button>`)}
function cmSaveEdit(id){cmPosts.find(x=>x.id===id).text=document.getElementById('cmEditText').value;closeOverlay();render()}
function cmDeletePost(id){if(!confirm('この投稿と返信を削除しますか？'))return;cmPosts.find(x=>x.id===id).deleted=true;render()}

function cmNewEvent(){openModal('イベントの作成申請','',`<div class="cm-modal"><label class="cm-dialog-field">イベント名<input id="cmEvName"></label><label class="cm-dialog-field">日時<input id="cmEvWhen" type="datetime-local"></label><label class="cm-dialog-field">場所<input id="cmEvPlace"></label><label class="cm-dialog-field">内容<textarea id="cmEvDesc"></textarea></label></div>`,`<button class="btn" onclick="closeOverlay()">キャンセル</button><button class="btn primary" onclick="cmCreateEvent()">申請する</button>`)}

function cmEventDetail(id){const e=cmEvents.find(x=>x.id===id);openModal(e.name,'',`<div class="cm-modal"><p><strong>開催日時：</strong>${mbEsc(e.when.replace('T',' '))}</p><p><strong>場所：</strong>${mbEsc(e.place)}</p><p>${mbEsc(e.description)}</p></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button><button class="btn primary" onclick="cmEventJoin(${id})">${e.joined?'参加を取り消す':'参加する'}</button>`)}

p(${g.id})">設定する</button></div>`).join('')}`}</div></div>`}
function cmAdminGroup(id){const g=cmGroups.find(x=>x.id===id);openModal('コミュニティの管理','',`<div class="cm-modal"><h3>${mbEsc(g.name)}</h3><p>${mbEsc(g.description)}</p><p class="cm-mini">立ち上げ主：${mbEsc(g.founder)} ／ ${g.members}人</p><label class="cm-dialog-field">ポイント付与<select id="cmPointOn"><option ${g.points?'selected':''} value="true">ON</option><option ${!g.points?'selected':''} value="false">OFF</option></select></label><label class="cm-dialog-field">ポイント倍率<input id="cmPointRate" type="number" min="0.1" step="0.1" value="${g.multiplier}"></label></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button>${g.status==='pending'?`<button class="btn" onclick="cmRejectGroup(${id})">却下</button><button class="btn primary" onclick="cmSaveGroup(${id},true)">承認する</button>`:`<button class="btn primary" onclick="cmSaveGroup(${id},false)">保存する</button>`}`)}
function cmSaveGroup(id,approve){let g=cmGroups.find(x=>x.id===id);g.points=document.getElementById('cmPointOn').value==='true';g.multiplier=Number(document.getElementById('cmPointRate').value)||1;if(approve)g.status='approved';closeOverlay();render()}
function cmRejectGroup(id){if(!confirm('申請を却下しますか？'))return;cmGroups.find(x=>x.id===id).status='rejected';closeOverlay();render()}
function cmAdminEvent(id){const e=cmEvents.find(x=>x.id===id);openModal('イベントの管理','',`<div class="cm-modal"><h3>${mbEsc(e.name)}</h3><p>${mbEsc(e.when.replace('T',' '))} · ${mbEsc(e.place)}</p><p>${mbEsc(e.description)}</p><label class="cm-dialog-field">参加ポイント<input type="number" min="0" id="cmEventPoints" value="${e.points}"></label></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button>${e.status==='pending'?`<button class="btn" onclick="cmRejectEvent(${id})">却下</button><button class="btn primary" onclick="cmApproveEvent(${id})">承認する</button>`:`<button class="btn primary" onclick="cmApproveEvent(${id})">保存する</button>`}`)}
function cmRejectEvent(id){if(!confirm('イベントを却下しますか？'))return;cmEvents.find(x=>x.id===id).status='rejected';closeOverlay();render()}
function cmApproveEvent(id){let e=cmEvents.find(x=>x.id===id);e.points=Number(document.getElementById('cmEventPoints').value)||0;e.status='approved';closeOverlay();render()}
function cmAdminPost(id){const p=cmPosts.find(x=>x.id===id);openModal('投稿の確認','',`<div class="cm-modal"><strong>${mbEsc(p.name)}</strong><p>${mbEsc(p.text)}</p><p class="cm-mini">コメント ${p.comments.length}件 · ${p.deleted?'削除済み':'公開中'}</p>${p.comments.map(c=>`<div class="cm-thread">${mbEsc(c)}</div>`).join('')}</div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button>${!p.deleted?`<button class="btn" onclick="cmAdminDelete(${id})">投稿を非表示にする</button>`:''}`)}
function cmAdminDelete(id){if(!confirm('投稿を非表示にしますか？'))return;cmPosts.find(x=>x.id===id).deleted=true;closeOverlay();render()}

c.contract.start)}\" ${final||role==='engineer'?'disabled':''}></div><div class=\"field\"><label>契約終了年月日</label><input type=\"date\" id=\"ct_end\" value=\"${esc(c.contract.end)}\" ${final||role==='engineer'?'disabled':''}></div><div class=\"field\"><label>入場予定年月日</label><input type=\"date\" id=\"ct_entry\" value=\"${esc(c.contract.entry)}\" ${final||role==='engineer'?'disabled':''}></div><div class=\"field\"><label>単価（円/月）</label><input type=\"number\" min=\"0\" id=\"ct_rate\" placeholder=\"例：750000\" value=\"${esc(c.contract.rate)}\" ${final||role==='engineer'?'disabled':''}></div></div>${!final&&role==='sales'?`<div class=\"actions\">${btn('契約情報を保存',`saveContract(${c.id})`,'primary')}</div>`:''}</div>`}</div></aside>`}function setRole(v){role=v;reasonOpen=false;if(drawer?.kind==='case'&&caseTab==='chat')markRead(drawer.id);render()}function markRead(id){const c=state.cases.find(x=>x.id===id);if(!c)return;if(role==='sales')c.readSales=c.chat.length;else c.readEngineer=c.chat.length;persist()}function declineEntry(id){const el=$('#declineReason');if(!el?.value.trim())return notify('辞退理由を入力してください');const c=state.cases.find(x=>x.id===id);c.chat.push({text:'エントリー辞退理由：'+el.value.trim(),at:new Date().toLocaleString('ja-JP'),system:false,role:'engineer'});reasonOpen=false;changeStatus(id,'エントリーしない')}\nfunction changeStatus(id,s){if(mdata().final)return;const c=state.cases.find(x=>x.id===id);if(!c||c.status===s)return;const old=c.status;c.status=s;if(s==='エントリー済')c.enteredAt=new Date().toISOString();if(['参画決定','待機'].includes(s)){const d=state.months[c.month];if(d){d.closed??={};d.closed[c.mid]=s}}c.chat.push({text:`ステータス変更：${old} → ${s}（${role==='sales'?'営業':'エンジニア'}）`,at:new Date().toLocaleString('ja-JP'),system:true,role:'system'});persist();if(s==='参画決定'&&!contractComplete(c))caseTab='contract';render()}function chatKeydown(e,id){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(id)}}function insertTemplate(t){const x=$('#message');if(!x)return;const texts={'面談候補日時':'面談候補日時：\\n①\\n②\\n③','条件確認':'稼働開始可能日：\\n就業時間：\\n出社・リモート条件：','面談後の所感':'面談の所感：\\n案件への意欲：\\n質問・懸念：','選考結果共有':'選考結果：\\n次の対応：','入場日確認':'入場予定日：\\n初日集合場所：\\n持参するもの：','面談希望日時':'面談希望日時：\\n①\\n②','案件についての質問':'確認したいこと：','面談の感想':'面談の感想：\\n参画意欲：','稼働条件の確認':'稼働開始日：\\n希望する働き方：'};x.value+=(x.value?'\\n':'')+(texts[t]||t);x.focus()}function sendChat(id){const el=$('#message'),v=el?.value.trim();if(!v)return;const c=state.cases.find(x=>x.id===id);c.chat.push({text:v,at:new Date().toLocaleString('ja-JP'),system:false,role});persist();markRead(id);render()}function saveContract(id){const c=state.cases.find(x=>x.id===id);c.contract={start:$('#ct_start').value,end:$('#ct_end').value,entry:$('#ct_entry').value,rate:$('#ct_rate').value};persist();render()}\nfunction openCaseModal(mid,id=null){modal={kind:'case',mid,id};render()}function closeModal(){modal=null;render()}function modalOverlay(){const c=modal.id?state.cases.find(c=>c.id===modal.id):null;return `<div class=\"shade2\" onclick=\"closeModal()\"></div><div class=\"modal\"><div class=\"buttons\" style=\"justify-content:space-between;margin-bottom:17px\"><h2>${c?'案件を編集':'新しい案件を追加'}</h2>${btn('×','closeModal()')}</div><div class=\"formgrid\"><div class=\"field full\"><label>会社名</label><input id=\"f_company\" value=\"${esc(c?.company||'')}\" placeholder=\"会社名\" maxlength=\"150\"></div><div class=\"field full\"><label>案件名</label><input id=\"f_title\" value=\"${esc(c?.title||'')}\" placeholder=\"案件名\" maxlength=\"150\"></div><div class=\"field full\"><label>最寄り駅</label><input id=\"f_station\" value=\"${esc(c?.station||'')}\" placeholder=\"最寄り駅 / フルリモート\"></div><div class=\"field full\"><label>その他・案件詳細</label><textarea id=\"f_notes\" placeholder=\"勤務条件・スキル要件・備考など\">${esc(c?.notes||'')}</textarea></div></div><div class=\"actions\" style=\"justify-content:space-between\">${c?btn('この案件を削除',`deleteCase(${c.id})`,'danger'):'<span></span>'}<div class=\"buttons\">${btn('キャンセル','closeModal()')}${btn(c?'変更を保存':'案件を追加','saveCase()','primary')}</div></div></div>`}function saveCase(){const company=$('#f_company').value.trim(),title=$('#f_title').value.trim();if(!company||!title)return notify('会社名と案件名は必須です');const v={company,title,station:$('#f_station').value.trim(),notes:$('#f_notes').value.trim()};if(modal.id){Object.assign(state.cases.find(c=>c.id===modal.id),v)}else{state.cases.push({id:state.next++,mid:modal.mid,month,...v,status:'提案中',owner:state.owners[modal.mid]||'',contract:{start:'',end:'',entry:'',rate:''},chat:[]})}const mid=modal.mid;modal=null;persist();openMember(mid,'cases')}function deleteCase(id){if(!confirm('この案件と案件チャット、契約情報を削除しますか？'))return;const mid=modal.mid;state.cases=state.cases.filter(c=>c.id!==id);modal=null;persist();openMember(mid,'cases')}render();\n<\/script>\n<style>\n/* v4 overrides */\n.compactcategories .categoryline{display:flex;flex-wrap:wrap;gap:10px}.compactcategories .categorycount{border-radius:8px;padding:10px 12px;border:1px solid var(--line);background:#fff;min-width:140px}.compactcategories .categorycount .dot{width:10px;height:10px;border-radius:999px;display:inline-block}.compactcategories .categorycount .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}.compactcategories .categorycount .numline{display:flex;align-items:baseline;gap:5px}\n.rowstack{display:flex;flex-direction:column;gap:2px}.mono{font-variant-numeric:tabular-nums}.wf-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);font-size:12px;border-radius:999px;background:#fff}.wf-badge.pending{color:#76520e;background:#fff8e7;border-color:#eed89e}.wf-badge.progress{color:var(--brand-strong);background:var(--theme-surface);border-color:var(--brand-border)}.wf-badge.done{color:#177d53;background:#eefbf4;border-color:#bfe7d0}.clickrow{cursor:pointer}.clickrow td{vertical-align:middle}.ownerfilter{min-width:160px}\n.caseflat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.caseflat .casecard{margin:0;curs dia (max-width:960px){.member-topgrid,.case-topgrid,.caseflat,.mini-kpis{grid-template-columns:1fr}.drawer.casewide{width:100vw}.chat-shell{max-height:none;min-height:420px}}\n</style>\n<script>\n(function(){\nwindow.ownerFilter = window.ownerFilter || '';\nwindow.empNo = m => String((m.no || (30000 + m.id))).padStart(5,'0');\nwindow.ownerOf = id => ((data().owners||state.owners)[id] || '未設定');\nwindow.typeTone = type => ({'新規営業':'#7C3AED','単価交渉':'#FC4C02','新規営業（終了予定）':'#BDBBFF','育児休業':'#777','介護休業':'#777','待機':'#177D53','休職':'#959494','勤怠免除':'#959494','内勤':'#010120'}[type] || '#7C3AED');\nwindow.workflowStatus = mid => { const cs=currentCases(mid); if(cs.some(c=>c.status==='参画決定')) return '確定'; if(cs.length) return '提案中'; return '未'; };\nwindow.workflowBadge = st => `<span class=\"wf-badge ${st==='確定'?'done':st==='提案中'?'progress':'pending'}\">${esc(st)}</span>`;\nwindow.typeCard = (type,count)=>`<button class=\"category-filter ${typeFilter===type?'on':''}\" style=\"--category-color:${typeTone(type)}\" onclick=\"typeFilter=typeFilter===${JSON.stringify(type)}?'':${JSON.stringify(type)};render()\"><span class=\"category-mark\" style=\"background:${typeTone(type)}\"></span><span>${esc(type)}</span><strong>${count}</strong><span class=\"tiny\">人</span></button>`;\nwindow.normalizeSeedStatuses = ()=>{ state.cases.forEach(c=>{ if(c.status==='面談後／オファー前') c.status='面談依頼'; if(typeof c.readSales!=='number') c.readSales=0; if(typeof c.readEngineer!=='number') c.readEngineer=0; if(!Array.isArray(c.chat)) c.chat=[]; c.chat.forEach(x=>{ if(!x.role && !x.system) x.role='sales'; }); }); persist(); };\nwindow.totalStats = function(){const ids=Object.keys(data().types);const cs=data().cases;return {ids:ids.length,active:ids.filter(id=>cs.some(c=>c.mid==id&&!['エントリーする','エントリーしない','お見送り','面談後お見送り'].includes(c.status))).length,proposals:cs.length,interviews:cs.filter(c=>['面談依頼','オファー','参画決定','面談後お見送り'].includes(c.status)).length,offers:cs.filter(c=>['オファー','参画決定'].includes(c.status)).l function mbTagInput(id,items,title){return `<label>${title}<div class="mb-tags-edit" id="${id}Wrap">${items.slice(0,MB_TAG_MAX).map(t=>`<span class="mb-pill">${mbEsc(t)}<button class="mb-tagremove" type="button" onclick="this.parentElement.remove()" aria-label="削除">×</button></span>`).join('')}<input id="${id}" placeholder="入力してEnterで追加" onkeydown="mbEnterTag(event,'${id}')"></div><span class="mb-tag-hint">最大${MB_TAG_MAX}個。Enterで追加できます。</span></label>`}
function mbCollectTags(id){const wrap=document.querySelector('#'+id+'Wrap');let tags=[...wrap.querySelectorAll('.mb-pill')].map(x=>x.textContent.replace('×','').trim()),extra=document.getElementById(id).value.trim();return [...new Set([...tags,...mbSplit(extra)])].slice(0,MB_TAG_MAX)}

function cmFullPage(admin=false){const b=admin?CM_ADMIN_SOURCE:CM_USER_SOURCE;let html=new TextDecoder().decode(Uint8Array.from(atob(b),x=>x.charCodeAt(0)));const t=opBrandThemes[opActiveTheme]||opBrandThemes[0];const vars=`<style id="onport-community-brand">:root{--brand-primary:${t.accent};--brand-strong:${t.deep};--brand-surface:${t.tint};--brand-border:${opMix(t.accent,"#ffffff",.57)};--brand-secondary:${opMix(t.accent,"#ffffff",.27)};--violet:${t.accent};--violetDeep:${t.deep};--violetTint:${t.tint}}</style>`;html=html.replace("</head>",vars+"</head>");return `<div class="cm-embedded-wrap"><iframe class="cm-embedded" title="${admin?'コミュニティ管理':'コミュニティ'}" srcdoc="${mbEsc(html)}"></iframe></div>`}
function cmEmbeddedUserUnused(){return cmFullPage(false)}
function cmEmbeddedAdminUnused(){return cmFullPage(true)}

/* v34: integrated community */
let cmSearch='',cmSection='joined',cmView='posts',cmEmojiFor=null,cmActionMenu=null,cmDraftImage=null,cmCommentDraftImage=null,cmAdminFilter='all';
const cmEmoji=['👍','❤️','😊','🎉','🙌','🔥','👀','😮'];
const cmMemberNames={'管理 太郎':'EMP001','田中 花子':'EMP001','佐藤 美咲':'EMP003','山田 次郎':'EMP002','鈴木 一郎':'EMP004'};
function cmProfile(name){const p=mbPeople.find(x=>x.name===name)||mbPeople.find(x=>x.id===cmMemberNames[name]);if(p)mbProfile(p.id);else openModal('メンバーのプロフィール','',`<div class="cm-person-detail"><span class="mb-avatar">${mbEsc(name.slice(0,1))}</span><strong>${mbEsc(name)}</strong><p>プロフィールの公開情報はありません。</p></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button>`)}
function cmAvatar(name){return `<button class="cm-avatar" title="${mbEsc(name)}のプロフィールを見る" onclick="cmProfile(${JSON.stringify(name)})">${mbEsc(name.slice(0,1))}</button>`}
function cmGroupStatus(g){return g.status==='pending'?'承認待ち':g.status==='rejected'?'却下':'公開中'}
function cmSideGroup(title,items){return items.length?`<div class="cm-nav-group"><h3>${title}<span>${items.length}</span></h3>${items.map(g=>`<button class="cm-nav-item ${g.id===cmCurrent?'on':''}" onclick="cmCurrent=${g.id};cmView='posts';render()"><span class="cm-glyph">${mbEsc(g.name.slice(0,1))}</span><span class="cm-nav-copy"><strong>${mbEsc(g.name)}</strong><small>${mbEsc(g.type)} · ${g.members}人</small></span>${g.pinned?'<span class="cm-pinsign" title="ピン留め">◆</span>':''}</button>`).join('')}</div>`:''}
function cmSelect(gid){cmCurrent=gid;cmView='posts';render()}
function cmMyRequests(){return cmGroups.filter(g=>g.status!=='approved'&&g.mine)}
function community(){const groups=cmGroups.filter(g=>g.status==='approved');let g=cmGroup();if(g.status!=='approved')g=groups[0];const q=cmSearch.toLowerCase();const list=groups.filter(x=>(x.name+' '+x.description+' '+x.type).toLowerCase().includes(q));const pinned=list.filter(x=>x.joined&&x.pinned),joined=list.filter(x=>x.joined&&!x.pinned),other=list.filter(x=>!x.joined);const my=cmMyRequests();return `<div class="cm-v34"><div class="cm-v34-top"><div><h2>コミュニティ</h2><p>共通の興味から、社内のつながりを広げる場所</p></div><button class="btn primary" onclick="cmNewGroup()">＋ コミュニティを作る</button></div><div class="cm-v34-grid"><aside class="cm-v34-sidebar"><div class="cm-v34-search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input type="search" placeholder="コミュニティを探す" aria-label="コミュニティ検索" value="${mbEsc(cmSearch)}" oninput="cmSearch=this.value;cmRefreshSidebar()"></div><div id="cmNavGroups">${cmSideGroup('お気に入り',pinned)}${cmSideGroup('参加している',joined)}${cmSideGroup('まだ参加していない',other)}${list.length?'':'<p class="cm-empty-side">該当するコミュニティがありません</p>'}</div>${my.length?`<div class="cm-pending-nav"><h3>作成した申請</h3>${my.map(x=>`<button onclick="cmRequestDetail(${x.id})"><strong>${mbEsc(x.name)}</strong><small>${cmGroupStatus(x)}</small></button>`).join('')}</div>`:''}</aside><section class="cm-v34-work">${cmBody(g)}</section></div></div>`}
function cmRefreshSidebar(){const node=document.getElementById('cmNavGroups');if(!node)return;const list=cmGroups.filter(g=>g.status==='approved'&&(g.name+' '+g.description+' '+g.type).toLowerCase().includes(cmSearch.toLowerCase()));node.innerHTML=cmSideGroup('お気に入り',list.filter(g=>g.joined&&g.pinned))+cmSideGroup('参加している',list.filter(g=>g.joined&&!g.pinned))+cmSideGroup('まだ参加していない',list.filter(g=>!g.joined))+(list.length?'':'<p class="cm-empty-side">該当するコミュニティがありません</p>')}
function cmBody(g){return `<div class="cm-v34-header"><div class="cm-heading-row"><span class="cm-cover">${mbEsc(g.name.slice(0,1))}</span><div class="cm-group-info"><div class="cm-titleline"><h3>${mbEsc(g.name)}</h3><span class="cm-category">${mbEsc(g.type)}</span></div><p>${mbEsc(g.description)}</p><div class="cm-group-meta">${g.members}人が参加 · 立ち上げ主 <button onclick="cmProfile(${JSON.stringify(g.founder)})">${mbEsc(g.founder)}</button></div></div></div><div class="cm-header-actions">${g.joined?`<button class="btn" onclick="cmPin(${g.id})">${g.pinned?'◆ ピン留め解除':'◇ お気に入りに追加'}</button><button class="btn" onclick="cmLeave(${g.id})">退出する</button>`:`<button class="btn primary" onclick="cmJoin(${g.id})">参加する</button>`}</div></div><div class="cm-v34-tabs">${[['posts','タイムライン'],['events','イベント'],['members','メンバー']].map(([id,name])=>`<button class="${cmView===id?'on':''}" onclick="cmView='${id}';render()">${name}${id==='members'?` <span>${g.members}</span>`:''}</button>`).join('')}</div>${cmView==='posts'?cmPostsContent(g):cmView==='events'?cmEventsContent(g):cmMembersContent(g)}`}
function cmPostsContent(g){const posts=cmPosts.filter(p=>p.group===g.id&&!p.deleted);return `<div class="cm-feed">${g.joined?`<div class="cm-write"><div class="cm-write-head">${cmAvatar('管理 太郎')}<textarea id="cmPostText" rows="2" placeholder="みんなに共有したいことは？"></textarea></div><div class="cm-write-foot"><label class="cm-upload" title="画像を選ぶ"><input type="file" id="cmPostImage" accept="image/*" onchange="cmPreviewUpload(this,'cmPostPreview')">▧ 画像</label><span id="cmPostPreview" class="cm-preview"></span><span class="cm-help">YouTubeのURLも共有できます</span><button class="btn primary" onclick="cmSubmitPost()">投稿する</button></div></div>`:'<div class="cm-join-note">参加すると投稿やコメントができます。<button class="btn primary" onclick="cmJoin('+g.id+')">参加する</button></div>'}${posts.length?posts.map(p=>cmPostCard(p,g.joined)).join(''):'<div class="cm-empty">まだ投稿がありません。</div>'}</div>`}
function cmPreviewUpload(input,target){const f=input.files?.[0];const n=document.getElementById(target);if(n)n.textContent=f?f.name:'';if(f&&f.size>5*1024*1024){atToast('画像は5MB以下にしてください');input.value='';if(n)n.textContent=''}}
function cmYouTube(text){const m=(text||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);return m?`<div class="cm-video"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" loading="lazy" title="YouTube動画" allowfullscreen></iframe></div>`:''}
function cmPostCard(p,joined){p.reactions??=[{emoji:'👍',count:p.likes||0,meOn:!!p.liked}];p.commentOpen??=false;const isMine=p.name==='管理 太郎';return `<article class="cm-post-v34"><header><div class="cm-author">${cmAvatar(p.name)}<div><button class="cm-author-name" onclick="cmProfile(${JSON.stringify(p.name)})">${mbEsc(p.name)}</button><small>${mbEsc(p.time)}</small></div></div>${isMine?`<div class="cm-post-more"><button class="cm-more-btn" title="投稿の操作" onclick="cmActionMenu=cmActionMenu===${p.id}?null:${p.id};render()">···</button>${cmActionMenu===p.id?`<div class="cm-more-menu"><button onclick="cmEditPost(${p.id})">編集</button><button onclick="cmDeletePost(${p.id})">削除</button></div>`:''}</div>`:''}</header><div class="cm-post-message">${mbEsc(p.text).replace(/\n/g,'<br>')}</div>${p.image?`<img class="cm-post-image" alt="添付画像" src="${p.image}">`:''}${cmYouTube(p.text)}<div class="cm-reaction-row">${p.reactions.map((r,i)=>`<button class="cm-react ${r.meOn?'on':''}" ${!joined?'disabled':''} onclick="cmReact(${p.id},${i})">${r.emoji} ${r.count}</button>`).join('')}${joined?`<button class="cm-add-emoji" onclick="cmEmojiFor=cmEmojiFor===${p.id}?null:${p.id};render()">＋</button>`:''}<button class="cm-comment-toggle" onclick="cmToggleComments(${p.id})">コメント ${p.comments.length}件 <span>${p.commentOpen?'⌃':'⌄'}</span></button></div>${cmEmojiFor===p.id?`<div class="cm-emojipicker">${cmEmoji.map(e=>`<button onclick="cmAddReact(${p.id},'${e}')">${e}</button>`).join('')}</div>`:''}${p.commentOpen?`<div class="cm-comments">${p.comments.length?p.comments.map((c,i)=>cmComment(p,c,i,joined)).join(''):'<p class="cm-no-comments">まだコメントはありません。</p>'}${joined?`<div class="cm-comment-write"><input id="cmReply${p.id}" placeholder="コメントを書く" onkeydown="if(event.key==='Enter')cmSendReply(${p.id})"><label title="画像を添付" class="cm-upload-mini"><input type="file" id="cmReplyFile${p.id}" accept="image/*">▧</label><button class="btn primary" onclick="cmSendReply(${p.id})">送信</button></div>`:''}</div>`:''}</article>`}
function cmComment(p,c,i,joined){let obj=typeof c==='string'?{name:c.split('：')[0].includes('：')?'':c.split('：')[0],text:c.includes('：')?c.split('：').slice(1).join('：'):c,reactions:[]}:c;obj.reactions??=[];return `<div class="cm-comment"><button class="cm-comment-avatar" onclick="cmProfile(${JSON.stringify(obj.name||'田中 花子')})">${mbEsc((obj.name||'田').slice(0,1))}</button><div class="cm-comment-content"><button class="cm-author-name" onclick="cmProfile(${JSON.stringify(obj.name||'田中 花子')})">${mbEsc(obj.name||'田中 花子')}</button><p>${mbEsc(obj.text)}</p>${obj.image?`<img class="cm-comment-image" src="${obj.image}" alt="コメントの添付画像">`:''}${cmYouTube(obj.text)}<div class="cm-comment-reacts">${obj.reactions.map((r,ri)=>`<button class="cm-react ${r.meOn?'on':''}" onclick="cmCommentReact(${p.id},${i},${ri})">${r.emoji} ${r.count}</button>`).join('')}${joined?`<button onclick="cmAddCommentReact(${p.id},${i})">＋ リアクション</button>`:''}${obj.name==='管理 太郎'?`<button onclick="cmDeleteComment(${p.id},${i})">削除</button>`:''}</div></div></div>`}
function cmReact(id,i){let p=cmPosts.find(x=>x.id===id),r=p.reactions[i];r.meOn=!r.meOn;r.count+=r.meOn?1:-1;render()}
function cmAddReact(id,e){let p=cmPosts.find(x=>x.id===id),r=p.reactions.find(x=>x.emoji===e);if(r){if(!r.meOn){r.meOn=true;r.count++}}else p.reactions.push({emoji:e,count:1,meOn:true});cmEmojiFor=null;render()}
function cmCommentReact(id,i,ri){let p=cmPosts.find(x=>x.id===id),o=cmNormalComment(p,i),r=o.reactions[ri];r.meOn=!r.meOn;r.count+=r.meOn?1:-1;render()}
function cmNormalComment(p,i){if(typeof p.comments[i]==='string'){const s=p.comments[i];p.comments[i]={name:s.includes('：')?s.split('：')[0]:'田中 花子',text:s.includes('：')?s.split('：').slice(1).join('：'):s,reactions:[]}}return p.comments[i]}
function cmAddCommentReact(id,i){const e=prompt('リアクションを選択：'+cmEmoji.join(' '),'👍');if(!cmEmoji.includes(e))return;let o=cmNormalComment(cmPosts.find(x=>x.id===id),i);let r=o.reactions.find(x=>x.emoji===e);if(!r)o.reactions.push({emoji:e,count:1,meOn:true});else if(!r.meOn){r.count++;r.meOn=true}render()}
function cmDeleteComment(id,i){if(!confirm('コメントを削除しますか？'))return;cmPosts.find(x=>x.id===id).comments.splice(i,1);render()}
function cmToggleComments(id){const p=cmPosts.find(x=>x.id===id);p.commentOpen=!p.commentOpen;render()}
function cmSendReply(id){const p=cmPosts.find(x=>x.id===id),t=document.getElementById('cmReply'+id)?.value.trim(),f=document.getElementById('cmReplyFile'+id)?.files?.[0];if(!t&&!f)return;const obj={name:'管理 太郎',text:t||'',reactions:[]};p.comments.push(obj);p.commentOpen=true;if(f&&f.size<=5*1024*1024){const r=new FileReader();r.onload=()=>{obj.image=r.result;render()};r.readAsDataURL(f)}else render()}
function cmSubmitPost(){const t=document.getElementById('cmPostText')?.value.trim(),f=document.getElementById('cmPostImage')?.files?.[0];if(!t&&!f){atToast('投稿する内容を入力してください');return}const p={id:Date.now(),group:cmCurrent,name:'管理 太郎',time:'たった今',text:t||'',likes:0,liked:false,comments:[],deleted:false,reactions:[]};cmPosts.unshift(p);if(f&&f.size<=5*1024*1024){const r=new FileReader();r.onload=()=>{p.image=r.result;render()};r.readAsDataURL(f)}else render()}
function cmPin(id){const g=cmGroups.find(x=>x.id===id);g.pinned=!g.pinned;render()}
function cmLeave(id){if(!confirm('このコミュニティから退出しますか？'))return;const g=cmGroups.find(x=>x.id===id);g.joined=false;g.pinned=false;g.members=Math.max(0,g.members-1);render()}
function cmMembersContent(g){const names=[g.founder,'管理 太郎','佐藤 美咲','山田 次郎','鈴木 一郎'];return `<div class="cm-members-list">${[...new Set(names)].slice(0,Math.max(g.members,1)).map((n,i)=>`<button onclick="cmProfile(${JSON.stringify(n)})" class="cm-member-row">${cmAvatarVisual(n)}<span><strong>${mbEsc(n)}</strong><small>${i===0?'立ち上げ主':'メンバー'}</small></span><span class="cm-member-open">プロフィールを見る ↗</span></button>`).join('')}</div>`}
function cmAvatarVisual(name){return `<span class="cm-avatar static">${mbEsc(name[0])}</span>`}
function cmEventsContent(g){const ev=cmEvents.filter(e=>e.group===g.id&&e.status==='approved');return `<div class="cm-events-view"><div class="cm-events-heading"><h3>イベント</h3>${g.joined?`<button class="btn primary" onclick="cmNewEvent()">＋ イベントを申請</button>`:''}</div>${ev.map(e=>`<div class="cm-event-row"><div class="cm-event-date"><strong>${mbEsc(e.when.slice(5,10).replace('-','/'))}</strong><small>${mbEsc(e.when.slice(11,16))}</small></div><div><h4>${mbEsc(e.name)}</h4><p>${mbEsc(e.place)} · ${mbEsc(e.description)}</p></div><button class="btn" onclick="cmEventDetail(${e.id})">詳細・参加</button></div>`).join('')||'<div class="cm-empty">開催予定のイベントはありません。</div>'}</div>`}
function cmNewGroup(){openModal('コミュニティを作る','承認されると、メンバーが参加・投稿できるようになります。',`<div class="cm-modal"><label class="cm-dialog-field">コミュニティ名<input id="cmNewName" maxlength="48" placeholder="例：映画好きの集まり"></label><label class="cm-dialog-field">カテゴリ<select id="cmNewType"><option>趣味系</option><option>勉強系</option><option>交流系</option></select></label><label class="cm-dialog-field">どんな活動をする？<textarea id="cmNewDesc" rows="4" placeholder="活動内容や、どんな人に参加してほしいか"></textarea></label><p class="cm-form-note">申請後、管理者の承認を受けて公開されます。</p></div>`,`<button class="btn" onclick="closeOverlay()">キャンセル</button><button class="btn primary" onclick="cmCreateGroup()">作成を申請する</button>`)}
function cmCreateGroup(){const n=document.getElementById('cmNewName').value.trim(),d=document.getElementById('cmNewDesc').value.trim();if(!n||!d){atToast('コミュニティ名と活動内容を入力してください');return}if(cmGroups.some(g=>g.name===n&&g.status!=='rejected')){atToast('同じ名前のコミュニティが既にあります');return}cmGroups.push({id:Date.now(),name:n,type:document.getElementById('cmNewType').value,description:d,founder:'管理 太郎',members:0,joined:false,mine:true,status:'pending',points:true,multiplier:1});closeOverlay();render();atToast('作成を申請しました。承認されると公開されます')}
function cmRequestDetail(id){const g=cmGroups.find(x=>x.id===id);openModal('コミュニティ作成申請','',`<div class="cm-request-detail"><strong>${mbEsc(g.name)}</strong><span class="cm-request-state">${cmGroupStatus(g)}</span><p>${mbEsc(g.description)}</p><p>カテゴリ：${mbEsc(g.type)}</p>${g.status==='pending'?'<p class="cm-form-note">管理者による承認待ちです。公開されるまでは他の社員には表示されません。</p>':''}</div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button>${g.status==='pending'?`<button class="btn" onclick="cmCancelGroup(${id})">申請を取り下げる</button>`:''}`)}
function cmCancelGroup(id){if(!confirm('コミュニティ作成申請を取り下げますか？'))return;cmGroups=cmGroups.filter(x=>x.id!==id);closeOverlay();render()}
function cmAdmin(){const pg=cmGroups.filter(g=>g.status==='pending').length,pe=cmEvents.filter(e=>e.status==='pending').length;const tabs=[['communities','コミュニティ'],['events','イベント'],['posts','投稿・コメント'],['points','ポイント設定']];return `<div class="cm-v34 cm-admin-v34"><div class="cm-v34-top"><div><h2>コミュニティ管理</h2><p>公開申請・イベント・投稿とポイントを管理</p></div></div><div class="cm-v34-tabs cm-admin-tabs">${tabs.map(([k,v])=>`<button class="${cmAdminTab===k?'on':''}" onclick="cmAdminTab='${k}';render()">${v}${k==='communities'&&pg?` <span>${pg}</span>`:k==='events'&&pe?` <span>${pe}</span>`:''}</button>`).join('')}</div><div class="cm-admin-surface"><div class="cm-admin-filter"><label>表示<select onchange="cmAdminFilter=this.value;render()"><option value="all" ${cmAdminFilter==='all'?'selected':''}>すべて</option><option value="pending" ${cmAdminFilter==='pending'?'selected':''}>承認待ち</option><option value="approved" ${cmAdminFilter==='approved'?'selected':''}>公開中</option><option value="rejected" ${cmAdminFilter==='rejected'?'selected':''}>却下</option></select></label></div>${cmAdminTab==='communities'?`<div class="cm-admin-th"><span>コミュニティ</span><span>立ち上げ主</span><span>参加人数</span><span>状態</span><span></span></div>${cmGroups.filter(g=>cmAdminFilter==='all'||g.status===cmAdminFilter).map(g=>`<div class="cm-admin-tr"><strong>${mbEsc(g.name)}<small>${mbEsc(g.type)}</small></strong><span>${mbEsc(g.founder)}</span><span>${g.members}人</span><span class="cm-status ${g.status}">${cmGroupStatus(g)}</span><button class="btn" onclick="cmAdminGroup(${g.id})">${g.status==='pending'?'審査する':'詳細・設定'}</button></div>`).join('')}`:cmAdminTab==='events'?`<div class="cm-admin-th"><span>イベント</span><span>コミュニティ</span><span>開催日時</span><span>状態</span><span></span></div>${cmEvents.filter(e=>cmAdminFilter==='all'||e.status===cmAdminFilter).map(e=>`<div class="cm-admin-tr"><strong>${mbEsc(e.name)}</strong><span>${mbEsc(cmGroups.find(g=>g.id===e.group)?.name||'')}</span><span>${mbEsc(e.when.replace('T',' '))}</span><span class="cm-status ${e.status}">${cmGroupStatus(e)}</span><button class="btn" onclick="cmAdminEvent(${e.id})">${e.status==='pending'?'審査する':'詳細・設定'}</button></div>`).join('')}`:cmAdminTab==='posts'?cmPosts.map(p=>`<div class="cm-admin-post"><div><strong>${mbEsc(p.name)}</strong><small>${mbEsc(cmGroups.find(g=>g.id===p.group)?.name||'')} · ${mbEsc(p.time)} · ${p.deleted?'非表示':'公開中'}</small><p>${mbEsc(p.text.slice(0,140))}</p><small>コメント ${p.comments.length}件</small></div><button class="btn" onclick="cmAdminPost(${p.id})">投稿・コメントを確認</button></div>`).join(''):`<div class="cm-admin-points"><div class="cm-points-line"><span>投稿</span><input type="number" min="0" value="2">pt / 1日の上限 <input type="number" min="1" value="5">回</div><div class="cm-points-line"><span>コメント</span><input type="number" min="0" value="1">pt / 1日の上限 <input type="number" min="1" value="5">回</div><div class="cm-points-line"><span>リアクション</span><input type="number" min="0" value="1">pt / 1日の上限 <input type="number" min="1" value="5">回</div><button class="btn primary" onclick="atToast('ポイントルールを保存しました（モック）')">変更を保存</button><div class="cm-point-groups">${cmGroups.filter(g=>g.status==='approved').map(g=>`<div><strong>${mbEsc(g.name)}</strong><span>${g.points?'付与ON':'付与OFF'} / ${g.multiplier}倍</span><button class="btn" onclick="cmAdminGroup(${g.id})">設定</button></div>`).join('')}</div></div>`}</div></div>`}
function cmAdminGroup(id){const g=cmGroups.find(x=>x.id===id);openModal(g.status==='pending'?'コミュニティの公開審査':'コミュニティの設定','',`<div class="cm-modal"><h3>${mbEsc(g.name)}</h3><p>${mbEsc(g.description)}</p><p class="cm-form-note">申請者：${mbEsc(g.founder)} · カテゴリ：${mbEsc(g.type)}</p><label class="cm-dialog-field">カテゴリ<select id="cmAdminType">${['趣味系','勉強系','交流系'].map(s=>`<option ${g.type===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="cm-dialog-field">ポイント付与<select id="cmPointOn"><option value="true" ${g.points?'selected':''}>ON</option><option value="false" ${!g.points?'selected':''}>OFF</option></select></label><label class="cm-dialog-field">ポイント倍率<input id="cmPointRate" type="number" min="0.1" step="0.1" value="${g.multiplier}"></label></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button>${g.status==='pending'?`<button class="btn" onclick="cmRejectGroup(${id})">却下する</button><button class="btn primary" onclick="cmSaveGroup(${id},true)">承認して公開</button>`:`<button class="btn primary" onclick="cmSaveGroup(${id},false)">変更を保存</button>`}`)}
function cmSaveGroup(id,approve){const g=cmGroups.find(x=>x.id===id);g.type=document.getElementById('cmAdminType').value;g.points=document.getElementById('cmPointOn').value==='true';g.multiplier=Math.max(.1,Number(document.getElementById('cmPointRate').value)||1);if(approve){g.status='approved';g.joined=true;g.members=1;g.pinned=false;cmCurrent=id}closeOverlay();render();atToast(approve?'承認しました。コミュニティが公開されました':'設定を保存しました')}
function cmAdminPost(id){const p=cmPosts.find(x=>x.id===id);openModal('投稿・コメントの確認','',`<div class="cm-modal"><strong>${mbEsc(p.name)}</strong><p>${mbEsc(p.text)}</p><div class="cm-moderation">${p.comments.map((c,i)=>{const o=cmNormalComment(p,i);return `<div><strong>${mbEsc(o.name)}</strong><p>${mbEsc(o.text)}</p><button class="btn" onclick="cmAdminRemoveComment(${id},${i})">コメントを非表示</button></div>`}).join('')||'コメントはありません。'}</div></div>`,`<button class="btn" onclick="closeOverlay()">閉じる</button>${p.deleted?`<button class="btn primary" onclick="cmAdminRestore(${id})">投稿を再公開</button>`:`<button class="btn" onclick="cmAdminDelete(${id})">投稿を非表示</button>`}`)}
function cmAdminRemoveComment(id,i){if(!confirm('このコメントを非表示にしますか？'))return;cmPosts.find(x=>x.id===id).comments.splice(i,1);closeOverlay();cmAdminPost(id)}
function cmAdminRestore(id){cmPosts.find(x=>x.id===id).deleted=false;closeOverlay();render()}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){atSettingsOpen=false;atApplyOpen=false;atExportMenuOpen=false;closeOverlay();if(view==='attendance')render()}});render();

let pmPointTab='history',pmPointFilter='all',pmBalance=2480,pmReceivers=[],pmGifts=[{id:1,name:'スターバックスギフトカード 1,000円分',pt:1000,icon:'☕',description:'カフェで利用できるギフトカード',status:'public',count:8},{id:2,name:'Amazonギフト券 500円分',pt:500,icon:'🎟',description:'オンラインのお買い物に利用できます',status:'public',count:15},{id:3,name:'ランチ補助券 500円分',pt:500,icon:'🍱',description:'食事の補助券',status:'public',count:6},{id:4,name:'書籍購入補助 1,500円分',pt:1500,icon:'📚',description:'書籍購入の補助に利用できます',status:'public',count:3},{id:5,name:'Switchオンラインサービス 3ヶ月',pt:2000,icon:'🎮',description:'オンライン利用券',status:'stopped',count:1},{id:6,name:'リラクゼーションセット',pt:3000,icon:'🧴',description:'ケア用品のセット',status:'public',count:0}];
let pmHistory=[{date:'2026/10/23 09:00',type:'auto',content:'ログインボーナス',pt:2},{date:'2026/10/21 14:22',type:'manual',content:'会社設立記念ポイント',pt:1000},{date:'2026/10/20 11:10',type:'present',content:'佐藤 美咲さんから（ありがとう！）',pt:100},{date:'2026/10/16 09:01',type:'auto',content:'お知らせ閲覧',pt:2},{date:'2026/10/10 14:20',type:'redeem',content:'Amazonギフト券 500円分',pt:-500},{date:'2026/10/03 13:45',type:'auto',content:'投稿ボーナス',pt:5}];
