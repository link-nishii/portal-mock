件提案数',cs.length+'件')}${line('提案中',cs.filter(c=>!['参画決定','待機','お見送り','面談後お見送り','エントリーしない'].includes(c.status)).length+'件')}${line('参画決定',won.length+'件')}</div></div><div class="infobox" style="margin-top:13px"><h3>参画決定した案件 / 次の契約情報</h3>${won.length?won.map(c=>`<div class="casecard" onclick="openCase(${c.id})"><div><b>${esc(c.company)}</b> / ${esc(c.title)}<div class="tiny textmuted">${esc(c.contract.start||'契約開始未入力')} 〜 ${esc(c.contract.end||'終了未入力')} / ${fmt(c.contract.rate)}</div></div><span>→</span></div>`).join(''):'<div class="textmuted">参画決定した案件はありません。</div>'}</div>${btn('案件・営業状況を見る →',"drawer.tab='cases';render()",'primary')}`:`<div class="buttons" style="justify-content:space-between"><div class="textmuted tiny">案件をクリックすると、進捗・チャット・契約情報を確認できます</div>${!final?btn('＋ 案件追加',`openCaseModal(${m.id})`,'primary'):''}</div><div class="mini-kpis">${[['案件提案数',cs.length],['面談依頼数',cs.filter(c=>['面談依頼','オファー','参画決定','面談後お見送り'].includes(c.status)).length],['オファー数',cs.filter(c=>['オファー','参画決定'].includes(c.status)).length],['面談通過率',`${cs.filter(c=>['オファー','参画決定'].includes(c.status)).length}/${cs.filter(c=>['面談依頼','オファー','参画決定','面談後お見送り'].includes(c.status)).length}`]].map(([k,v])=>`<div><small>${k}</small><strong>${v}</strong></div>`).join('')}</div>${cs.map(c=>`<div class="casecard" onclick="openCase(${c.id})"><div style="min-width:0"><b>${esc(c.company)}</b><div>${esc(c.title)}</div><div class="case-meta"><span class="pill ${c.status==='参画決定'?'green':'purple'}">${esc(c.status)}</span><span class="tiny textmuted">[最寄り駅] ${esc(c.station||'未登録')}</span>${unreadFor(c)?`<span class="unread">未読 ${unreadFor(c)}</span>`:''}${c.status==='参画決定'&&!contractComplete(c)?'<span class="pill red">契約情報の入力待ち</span>':''}</div><span>→</span></div>`).join('')||'<div class="empty">登録案件はありません。案件追加から登録できます。</div>'}`}</div></aside>`}function changeOwner(mid,o){state.owners[mid]=o;persist();render()}function contractComplete(c){return !!(c.contract?.start&&c.contract?.end&&c.contract?.entry&&c.contract?.rate)}
function detail(k,v){return `<div class="field"><label>${esc(k)}</label><div class="value">${esc(v)}</div></div>`}
function unreadFor(c){return Math.max(0,(c.chat||[]).length-(role==='sales'?(c.readSales||0):(c.readEngineer||0)))}function chatMetrics(cs){let interviews=cs.filter(c=>['面談依頼','面談後お見送り','オファー','参画決定'].includes(c.status)).length,offers=cs.filter(c=>['オファー','参画決定'].includes(c.status)).length;return [cs.length,interviews,offers,interviews?Math.round(offers/interviews*100)+'% ('+offers+'/'+interviews+')':'— (0/0)']}function caseDrawer(){const c=data().cases.find(c=>c.id===drawer.id);if(!c){drawer=null;return ''}const m=getMember(c.mid),final=mdata().final;const unread=unreadFor(c);return `<aside class="drawer narrow"><div class="drawerhead"><div><button class="link tiny" onclick="openMember(${m.id},'cases')">← ${esc(m.name)}の案件一覧</button><div class="tiny textmuted" style="margin-top:9px">${ym(month)} / ${esc(c.company)}</div><h2>${esc(c.title)}</h2></div>${btn('×','closeDrawer()')}</div><div class="drawerbody"><div class="deal-split"><div class="infobox"><div class="buttons" style="justify-content:space-between"><h3>案件情報</h3>${!final?btn('編集',`openCaseModal(${c.mid},${c.id})`):''}</div><dl class="compactdetails"><dt>会社名</dt><dd>${esc(c.company)}</dd><dt>案件名</dt><dd>${esc(c.title)}</dd><dt>最寄り駅</dt><dd>${esc(c.station||'—')}</dd></dl>${c.notes?`<div class="case-extra">${esc(c.notes)}</div>`:''}</div><div class="infobox"><h3>営業進捗</h3><div class="tiny textmuted" style="margin:5px 0 9px">担当営業：${esc(state.owners[c.mid]||'未設定')}</div>${role==='sales'?`<div class="field"><label>ステータス</label><select ${final?'disabled':''} onchange="changeStatus(${c.id},this.value)">${statusOpts(c.status)}</select></div>`:`<div class="tiny textmuted">現在のステータス</div><b>${esc(c.status)}</b><div class="status-choice">${!final&&c.status==='提案中'?btn('エントリー希望',`changeStatus(${c.id},'エントリーする')`)+btn('エントリー辞退',`reasonOpen=true;render()`):''}</div>`}${role==='engineer'&&reasonOpen?`<div class="reasonfield"><label>辞退理由</label><textarea id="declineReason" placeholder="辞退理由を入力してください"></textarea>${btn('辞退を確定する',`declineEntry(${c.id})`,'primary')}${btn('キャンセル',`reasonOpen=false;render()`)}</div>`:''}</div></div>${c.status==='参画決定'&&!contractComplete(c)?`<div class="warncontract">参画決定です。契約情報が未入力のため、入力してください。 ${btn('契約情報を入力',"caseTab='contract';render()")}</div>`:''}${c.status==='待機'||c.status==='参画決定'?'<div class="snapshot">この社員の今月の営業はクローズ扱いです。月次データは確定するまで編集できます。</div>':''}<div class="casetabs"><button class="casetab ${caseTab==='chat'?'active':''}" onclick="caseTab='chat';render()">案件チャット ${unread?`<span class="unread">${unread}</span>`:''}</button><button class="casetab ${caseTab==='contract'?'active':''}" onclick="caseTab='contract';render()">契約情報</button></div>${caseTab==='chat'?`<div class="role-toggle"><span class="tiny textmuted">表示・発言する側（モック）</span><button class="${role==='sales'?'active':''}" onclick="setRole('sales')">営業側 ${c.chat.length-(c.readSales||0)?`<span class="unread">${c.chat.length-(c.readSales||0)}</span>`:''}</button><button class="${role==='engineer'?'active':''}" onclick="setRole('engineer')">エンジニア側 ${c.chat.length-(c.readEngineer||0)?`<span class="unread">${c.chat.length-(c.readEngineer||0)}</span>`:''}</button></div><div class="chat" id="chatHistory">${c.chat.map(x=>`<div class="bubble ${x.system?'system':x.role===role?'':'them'}">${!x.system?`<div class="chat-meta">${x.role==='engineer'?m.name:'担当営業'}</div>`:''}<div class="chat-message-body">${esc(x.text)}</div><div class="tiny textmuted">${formatChatDate(x.at)}</div></div>`).join('')||'<div class="empty">メッセージはまだありません。</div>'}</div>${!final?`<div class="chatinput"><textarea id="message" onkeydown="chatKeydown(event,${c.id})" placeholder="Enterで送信 / Shift+Enterで改行"></textarea>${btn('送信',`sendChat(${c.id})`,'primary')}</div><div class="chat-tools"><div class="tiny textmuted">定型入力</div><div class="quicktemplates">${(role==='sales'?['面談候補日時','条件確認','面談後の所感','選考結果共有','入場日確認']:['面談希望日時','案件についての質問','面談の感想','稼働条件の確認']).map(t=>`<button class="tinyaction" onclick="insertTemplate('${t}')">${t}</button>`).join('')}</div></div>`:''}`:`<div class="infobox"><h3>この案件の契約情報</h3><div class="tiny textmuted" style="margin-bottom:14px">参画決定時に入力してください。社員詳細にも同じ契約情報を表示します。</div><div class="formgrid"><div class="field"><label>契約開始年月日</label><input type="date" id="ct_start" value="${esc(c.contract.start)}" ${final||role==='engineer'?'disabled':''}></div><div class="field"><label>契約終了年月日</label><input type="date" id="ct_end" value="${esc(c.contract.end)}" ${final||role==='engineer'?'disabled':''}></div><div class="field"><label>入場予定年月日</label><input type="date" id="ct_entry" value="${esc(c.contract.entry)}" ${final||role==='engineer'?'disabled':''}></div><div class="field"><label>単価（円/月）</label><input type="number" min="0" id="ct_rate" placeholder="例：750000" value="${esc(c.contract.rate)}" ${final||role==='engineer'?'disabled':''}></div></div>${!final&&role==='sales'?`<div class="actions">${btn('契約情報を保存',`saveContract(${c.id})`,'primary')}</div>`:''}</div>`}</div></aside>`}function setRole(v){role=v;reasonOpen=false;if(drawer?.kind==='case'&&caseTab==='chat')markRead(drawer.id);render()}function markRead(id){const c=state.cases.find(x=>x.id===id);if(!c)return;if(role==='sales')c.readSales=c.chat.length;else c.readEngineer=c.chat.length;persist()}function declineEntry(id){const el=$('#declineReason');if(!el?.value.trim())return notify('辞退理由を入力してください');const c=state.cases.find(x=>x.id===id);c.chat.push({text:'エントリー辞退理由：'+el.value.trim(),at:new Date().toLocaleString('ja-JP'),system:false,role:'engineer'});reasonOpen=false;changeStatus(id,'エントリーしない')}
function changeStatus(id,s){if(mdata().final)return;const c=state.cases.find(x=>x.id===id);if(!c||c.status===s)return;const old=c.status;c.status=s;if(s==='エントリー済')c.enteredAt=new Date().toISOString();if(['参画決定','待機'].includes(s)){const d=state.months[c.month];if(d){d.closed??={};d.closed[c.mid]=s}}c.chat.push({text:`ステータス変更：${old} → ${s}（${role==='sales'?'営業':'エンジニア'}）`,at:new Date().toLocaleString('ja-JP'),system:true,role:'system'});persist();if(s==='参画決定'&&!contractComplete(c))caseTab='contract';render()}function chatKeydown(e,id){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(id)}}function insertTemplate(t){const x=$('#message');if(!x)return;const texts={'面談候補日時':'面談候補日時：\n①\n②\n③','条件確認':'稼働開始可能日：\n就業時間：\n出社・リモート条件：','面談後の所感':'面談の所感：\n案件への意欲：\n質問・懸念：','選考結果共有':'選考結果：\n次の対応：','入場日確認':'入場予定日：\n初日集合場所：\n持参するもの：','面談希望日時':'面談希望日時：\n①\n②','案件についての質問':'確認したいこと：','面談の感想':'面談の感想：\n参画意欲：','稼働条件の確認':'稼働開始日：\n希望する働き方：'};x.value+=(x.value?'\n':'')+(texts[t]||t);x.focus()}function sendChat(id){const el=$('#message'),v=el?.value.trim();if(!v)return;const c=state.cases.find(x=>x.id===id);c.chat.push({text:v,at:new Date().toLocaleString('ja-JP'),system:false,role});persist();markRead(id);render()}function saveContract(id){const c=state.cases.find(x=>x.id===id);c.contract={start:$('#ct_start').value,end:$('#ct_end').value,entry:$('#ct_entry').value,rate:$('#ct_rate').value};persist();render()}
function openCaseModal(mid,id=null){modal={kind:'case',mid,id};render()}function closeModal(){modal=null;render()}function modalOverlay(){const c=modal.id?state.cases.find(c=>c.id===modal.id):null;return `<div class="shade2" onclick="closeModal()"></div><div class="modal"><div class="buttons" style="justify-content:space-between;margin-bottom:17px"><h2>${c?'案件を編集':'新しい案件を追加'}</h2>${btn('×','closeModal()')}</div><div class="formgrid"><div class="field full"><label>会社名</label><input id="f_company" value="${esc(c?.company||'')}" placeholder="会社名" maxlength="150"></div><div class="field full"><label>案件名</label><input id="f_title" value="${esc(c?.title||'')}" placeholder="案件名" maxlength="150"></div><div class="field full"><label>最寄り駅</label><input id="f_station" value="${esc(c?.station||'')}" placeholder="最寄り駅 / フルリモート"></div><div class="field full"><label>その他・案件詳細</label><textarea id="f_notes" placeholder="勤務条件・スキル要件・備考など">${esc(c?.notes||'')}</textarea></div></div><div class="actions" style="justify-content:space-between">${c?btn('この案件を削除',`deleteCase(${c.id})`,'danger'):'<span></span>'}<div class="buttons">${btn('キャンセル','closeModal()')}${btn(c?'変更を保存':'案件を追加','saveCase()','primary')}</div></div></div>`}function saveCase(){const company=$('#f_company').value.trim(),title=$('#f_title').value.trim();if(!company||!title)return notify('会社名と案件名は必須です');const v={company,title,station:$('#f_station').value.trim(),notes:$('#f_notes').value.trim()};if(modal.id){Object.assign(state.cases.find(c=>c.id===modal.id),v)}else{state.cases.push({id:state.next++,mid:modal.mid,month,...v,status:'提案中',owner:state.owners[modal.mid]||'',contract:{start:'',end:'',entry:'',rate:''},chat:[]})}const mid=modal.mid;modal=null;persist();openMember(mid,'cases')}function deleteCase(id){if(!confirm('この案件と案件チャット、契約情報を削除しますか？'))return;const mid=modal.mid;state.cases=state.cases.filter(c=>c.id!==id);modal=null;persist();openMember(mid,'cases')}render();

<script>
(function(){

window.empNo = m => String((m.no || (30000 + m.id))).padStart(5,'0');
window.ownerOf = id => ((data().owners||state.owners)[id] || '未設定');
window.typeTone = type => ({'新規営業':'#7C3AED','単価交渉':'#FC4C02','新規営業（終了予定）':'#BDBBFF','育児休業':'#777','介護休業':'#777','待機':'#177D53','休職':'#959494','勤怠免除':'#959494','内勤':'#010120'}[type] || '#7C3AED');
window.workflowStatus = mid => { const cs=currentCases(mid); if(cs.some(c=>c.status==='参画決定')) return '確定'; if(cs.length) return '提案中'; return '未'; };
window.workflowBadge = st => `<span class="wf-badge ${st==='確定'?'done':st==='提案中'?'progress':'pending'}">${esc(st)}</span>`;
window.typeCard = (type,count)=>`<button class="category-filter ${typeFilter===type?'on':''}" style="--category-color:${typeTone(type)}" onclick="typeFilter=typeFilter===${JSON.stringify(type)}?'':${JSON.stringify(type)};render()"><span class="category-mark" style="background:${typeTone(type)}"></span><span>${esc(type)}</span><strong>${count}</strong><span class="tiny">人</span></button>`;
window.normalizeSeedStatuses = ()=>{ state.cases.forEach(c=>{ if(c.status==='面談後／オファー前') c.status='面談依頼'; if(typeof c.readSales!=='number') c.readSales=0; if(typeof c.readEngineer!=='number') c.readEngineer=0; if(!Array.isArray(c.chat)) c.chat=[]; c.chat.forEach(x=>{ if(!x.role && !x.system) x.role='sales'; }); }); persist(); };
window.totalStats = function(){const ids=Object.keys(data().types);const cs=data().cases;return {ids:ids.length,active:ids.filter(id=>cs.some(c=>c.mid==id&&!['エントリーする','エントリーしない','お見送り','面談後お見送り'].includes(c.status))).length,proposals:cs.length,interviews:cs.filter(c=>['面談依頼','オファー','参画決定','面談後お見送り'].includes(c.status)).length,offers:cs.filter(c=>['オファー','参画決定'].includes(c.status)).length,decided:cs.filter(c=>c.status==='参画決定').length}};
window.allowedMonths = function(){const [y,m]=month.split('-').map(Number); return [-1,0,1].map(n=>{const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})};
window.monthSelector = function(id='targetMonth'){return `<select id="${id}">${allowedMonths().map(mm=>`<option value="${mm}" ${mm===month?'selected':''}>${ym(mm)}</option>`).join('')}</select>`};
window.monthPage = function(s,final){const ids=Object.keys(data().types).map(Number);const rows=members.filter(m=>ids.includes(m.id)).filter(m=>!typeFilter||data().types[m.id]===typeFilter).filter(m=>!ownerFilter||ownerOf(m.id)===ownerFilter).filter(m=>!query||((m.name+m.skill+m.team+empNo(m)+(m.current.company||'')).toLowerCase().includes(query.toLowerCase()))).filter(m=>!statusFilter||workflowStatus(m.id)===statusFilter);const typeCounts=CATS.filter(c=>ids.some(id=>data().types[id]===c));return `<div class="monthbar"><div class="buttons">${btn('←', 'monthShift(-1)')}<span class="month">${ym(month)}</span>${btn('→','monthShift(1)')}<span class="pill ${final?'purple':'gray'}">${final?'確定済・履歴固定':'編集中'}</span></div><div class="buttons">${final?btn('確定を解除','unfinalize()'):btn('この月を確定する','finalize()','primary')}${btn('CSV出力','exportCSV()')}</div></div>${final?`<div class="snapshot">[✓] ${ym(month)}の営業状況は確定時点の状態で保存されています。現在の案件変更は反映されません。確定解除後に編集可能です。</div>`:''}<div class="metrics">${[['営業対象者',s.ids],['営業着手',s.active],['案件提案',s.proposals],['面談依頼以上',s.interviews],['オファー以上',s.offers],['参画決定',s.decided]].map(([label,value],i)=>`<div class="metric"><small>${label}</small><div class="num ${i===0?'purple':''}">${value}</div></div>`).join('')}</div><div class="compactcategories"><h2>営業種別 / 人数</h2><div class="categoryline">${typeCounts.map(c=>typeCard(c,ids.filter(id=>data().types[id]===c).length)).join('')||'<span class="textmuted">営業対象者なし</span>'}</div></div><section class="section"><div class="sectionhead"><h2>${ym(month)}の営業対象者 <span class="highlight">${ids.length}名</span></h2>${!final?btn('[+] 対象者を追加',"view='employees';render()",'primary'):''}</div><div class="sectionbody"><div class="filters"><input class="search" placeholder="氏名・社員番号・スキル・所属で検索" value="${esc(query)}" oninput="query=this.value;refreshRows()"><select onchange="typeFilter=this.value;refreshRows()"><option value="">全営業種別</option>${CATS.map(c=>`<option ${c===typeFilter?'selected':''}>${c}</option>`).join('')}</select><select class="ownerfilter" onchange="ownerFilter=this.value;refreshRows()"><option value="">全担当営業</option>${OWNERS.map(o=>`<option ${o===ownerFilter?'selected':''}>${o}</option>`).join('')}</select><select onchange="statusFilter=this.value;refreshRows()"><option value="">全ステータス</option><option ${statusFilter==='未'?'selected':''}>未</option><option ${statusFilter==='提案中'?'selected':''}>提案中</option><option ${statusFilter==='確定'?'selected':''}>確定</option></select></div><div class="scroll" id="rows">${monthRows(rows,final)}</div></div></section>`};
window.monthRows = function(rows,final){if(!rows.length)return '<div class="empty">該当する営業対象者がいません</div>';return `<table><thead><tr><th>エンジニア</th><th>社員番号</th><th>所属・スキル</th><th>営業種別</th><th>担当営業</th><th>現契約終了</th><th>現契約先</th><th>提案件数</th><th>ステータス</th><th>${final?'履歴':'操作'}</th></tr></thead><tbody>${rows.map(m=>{const cs=currentCases(m.id);return `<tr class="clickrow" onclick="event.stopPropagation();openMember(${m.id})"><td><div class="rowstack"><span class="employee-name">${esc(m.name)}</span><div class="tiny textmuted">${esc(m.exp)} / ${esc(m.join)}入社</div></div></td><td class="mono">${empNo(m)}</td><td>${esc(m.team)}<div class="tiny textmuted">${esc(m.skill)}</div></td><td>${final?`<span class="pill">${esc(data().types[m.id])}</span>`:`<select class="smallselect" aria-label="${esc(m.name)}の営業種別" onclick="event.stopPropagation()" onchange="changeType(${m.id},this.value)">${catOpts(data().types[m.id])}</select>`}</td><td>${esc(ownerOf(m.id))}</td><td>${esc(m.current.end||'—')}</td><td>${esc(m.current.company||'—')}</td><td>${cs.length}件</td><td>${workflowBadge(workflowStatus(m.id))}</td><td>${final?'<span class="tiny textmuted">固定</span>':`<button class="remove-target" onclick="event.stopPropagation();removeTarget(${m.id})">対象から外す</button>`}</td></tr>`}).join('')}</tbody></table>`};
window.refreshRows = function(){const ids=Object.keys(data().types).map(Number);const rows=members.filter(m=>ids.includes(m.id)).filter(m=>!typeFilter||data().types[m.id]===typeFilter).filter(m=>!ownerFilter||ownerOf(m.id)===ownerFilter).filter(m=>!query||((m.name+m.skill+m.team+empNo(m)+(m.current.company||'')).toLowerCase().includes(query.toLowerCase()))).filter(m=>!statusFilter||workflowStatus(m.id)===statusFilter);$('#rows').innerHTML=monthRows(rows,mdata().final)};
window.employeePage = function(){return `<section class="section"><div class="sectionhead"><div><h2>営業対象にする社員を選択</h2><div class="note">対象月は「前月・当月・翌月」の3ヶ月から選べます。すでに登録済みの月はそのまま維持されます。</div></div><span class="pill purple">選択中 ${selected.size}名</span></div><div class="sectionbody"><div class="filters"><input class="search" placeholder="社員名・社員番号・所属・スキルを検索" oninput="filterEmployees(this.value)" id="empquery"><select id="empteam" onchange="filterEmployees($('#empquery').value)"><option value="">全部署</option>${[...new Set(members.map(m=>m.team))].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="scroll" id="empRows">${empRows(members)}</div></div></section><section class="section"><div class="sectionhead"><h2>選択した社員の登録先</h2></div><div class="sectionbody"><div class="tiny textmuted" style="margin-bottom:9px">登録する月（前月・当月・翌月）</div><div class="minirow">${monthSelector('bulkPicker')}${btn('選択した社員をこの月に登録','bulkAdd()','primary')}<span class="note">営業種別は登録後に設定できます（初期値：新規営業）</span></div></div></section>`};
window.empRows = function(ms){return `<table><thead><tr><th><input type="checkbox" onchange="toggleAll(this.checked)" aria-label="全社員を選択"></th><th>社員</th><th>社員番号</th><th>所属</th><th>主要スキル</th><th>現契約先</th><th>営業対象に登録済みの月</th></tr></thead><tbody>${ms.map(m=>{const months=Object.entries(state.months).filter(([x,d])=>!!d.types[m.id]).map(([x])=>x.replace('-', '年')+'月');return `<tr><td><input type="checkbox" data-emp-id="${m.id}" ${selected.has(m.id)?'checked':''} onchange="toggleSelect(${m.id},this.checked)"></td><td><button class="name" onclick="event.stopPropagation();openMember(${m.id})">${esc(m.name)}</button></td><td class="mono">${empNo(m)}</td><td>${esc(m.team)}</td><td>${esc(m.skill)}</td><td>${esc(m.current.company)}</td><td class="tiny">${months.join(' / ')||'—'}</td></tr>`}).join('')}</tbody></table>`};
window.filterEmployees = function(q){const t=$('#empteam').value;$('#empRows').innerHTML=empRows(members.filter(m=>(!t||t===m.team)&&(!q||((m.name+m.team+m.skill+empNo(m)+(m.current.company||'')).toLowerCase().includes(q.toLowerCase())))))};
window.bulkAdd = function(){if(!selected.size)return notify('社員を選択してください');const mm=$('#bulkPicker').value;if(!allowedMonths().includes(mm))return notify('前月・当月・翌月のいずれかを選択してください');const d=state.months[mm]||(state.months[mm]={final:false,types:{},snapshot:null});if(d.final)return notify('確定済みのため登録できません。先に確定を解除してください');selected.forEach(id=>{if(!d.types[id])d.types[id]='新規営業'});month=mm;selected.clear();view='month';persist();render()};
window.addNextMonth = function(mid){const mm=$('#carryMonth').value;if(!allowedMonths().includes(mm))return notify('前月・当月・翌月のいずれかを選択してください');if(mm===month)return notify('現在の月はすでに表示中です');const d=state.months[mm]||(state.months[mm]={final:false,types:{},snapshot:null});if(d.final)return notify('確定済みの月です');if(d.types[mid])return notify('その月にはすでに登録されています');d.types[mid]=mdata().types[mid]||'新規営業';persist();notify(ym(mm)+'に登録しました。案件・チャットは現在の月に残ります');render()};
window.memberDrawer = function(){const m=getMember(drawer.mid),cs=currentCases(m.id),won=cs.filter(c=>c.status==='参画決定'),t=data().types[m.id],final=mdata().final;const owners=OWNERS.map(o=>`<option value="${esc(o)}" ${ownerOf(m.id)===o?'selected':''}>${esc(o)}</option>`).join('');const item=(k,v)=>`<div class="summaryitem"><label>${esc(k)}</label><strong>${esc(v)}</strong></div>`;return `<aside class="drawer"><div class="drawerhead"><div><div class="tiny textmuted">ENGINEER / ${ym(month)} ${final?'[確定時点]':''}</div><h2>${esc(m.name)}</h2><div class="tiny textmuted">社員番号 ${empNo(m)} / ${esc(m.team)} / ${esc(m.skill)} / ${esc(m.exp)}</div></div>${btn('×','closeDrawer()')}</div><div class="drawerbody"><div class="casetabs"><button class="casetab ${drawer.tab==='overview'?'active':''}" onclick="drawer.tab='overview';render()">社員・契約情報</button><button class="casetab ${drawer.tab==='cases'?'active':''}" onclick="drawer.tab='cases';render()">案件・営業状況 (${cs.length})</button></div>${!final&&t?`<div class="month-assign"><span class="tiny textmuted">この社員を別の月にも登録</span>${monthSelector('carryMonth')}${btn('月に追加',`addNextMonth(${m.id})`)}</div>`:''}${drawer.tab==='overview'?`<div class="employee-owner"><label class="tiny textmuted">担当営業</label><select style="flex:1" ${final?'disabled':''} onchange="changeOwner(${m.id},this.value)">${owners}</select></div><div class="member-contractgrid"><section class="summarybox"><h3>現契約情報</h3><div class="summarylist">${item('契約先',m.current.company)}${item('契約開始',m.current.start||'—')}${item('契約終了',m.current.end||'—')}${item('単価（月額）',fmt(m.current.rate))}</div></section><section class="summarybox"><h3>参画決定した案件 / 次の契約情報</h3>${won.length?won.map(c=>`<div class="next-contract"><div class="next-heading"><strong>${esc(c.company)} / ${esc(c.title)}</strong><button class="tiny-link" onclick="openCase(${c.id})">案件を開く →</button></div><div class="summarylist">${item('契約開始',c.contract.start||'未入力')}${item('契約終了',c.contract.end||'未入力')}${item('入場予定日',c.contract.entry||'未入力')}${item('単価（月額）',fmt(c.contract.rate))}</div></div>`).join(''):'<div class="textmuted">参画決定した案件はありません。</div>'}</section></div>`:`<div class="case-list-head"><span class="textmuted tiny">案件を選択すると進捗・チャット・契約情報を確認できます。</span>${!final?btn('＋ 案件追加',`openCaseModal(${m.id})`,'primary'):''}</div><div class="metrics case-metrics">${[['案件提案数',cs.length],['面談依頼数',cs.filter(c=>['面談依頼','オファー','参画決定','面談後お見送り'].includes(c.status)).length],['オファー数',cs.filter(c=>['オファー','参画決定'].includes(c.status)).length],['面談通過率',`${cs.filter(c=>['オファー','参画決定'].includes(c.status)).length}/${cs.filter(c=>['面談依頼','オファー','参画決定','面談後お見送り'].includes(c.status)).length||0}`]].map(([k,v])=>`<div class="metric"><small>${k}</small><div class="num">${v}</div></div>`).join('')}</div><div class="case-list">${cs.map(c=>`<div class="case-list-item" onclick="openCase(${c.id})"><div class="case-list-top"><div><strong>${esc(c.company)}</strong><div class="case-title">${esc(c.title)}</div></div><span class="pill ${c.status==='参画決定'?'green':'purple'}">${esc(c.status)}</span></div><div class="case-list-bottom"><span class="tiny textmuted">最寄り駅：${esc(c.station||'未登録')}</span>${unreadFor(c)?`<span class="unread">未読 ${unreadFor(c)}</span>`:''}${c.status==='参画決定'&&!contractComplete(c)?'<span class="pill red">契約情報の入力待ち</span>':''}</div></div>`).join('')||'<div class="empty">登録案件はありません。案件追加から登録できます。</div>'}</div>`}</div></aside>`};
window.caseDrawer = function(){const c=data().cases.find(x=>x.id===drawer.id);if(!c){drawer=null;return ''}const m=getMember(c.mid),final=mdata().final;const unread=unreadFor(c);const statusButtons=!final&&role==='engineer'&&c.status==='提案中'?`<div class="status-choice">${btn('エントリー希望',`changeStatus(${c.id},'エントリーする')`)}${btn('エントリー辞退',`reasonOpen=true;render()`)}${reasonOpen?`<div class="reasonfield"><label>辞退理由</label><textarea id="declineReason" placeholder="辞退理由を入力してください"></textarea><div class="buttons" style="margin-top:8px">${btn('辞退を確定する',`declineEntry(${c.id})`,'primary')}${btn('キャンセル',`reasonOpen=false;render()`)}</div></div>`:''}</div>`:'';return `<aside class="drawer"><div class="drawerhead"><div><button class="link tiny" onclick="openMember(${m.id},'cases')">← ${esc(m.name)}の案件一覧</button><div class="tiny textmuted" style="margin-top:9px">${ym(month)} / ${esc(c.company)} / 社員番号 ${empNo(m)}</div><h2>${esc(c.title)}</h2></div>${btn('×','closeDrawer()')}</div><div class="drawerbody"><div class="case-topgrid"><div class="case-info-card"><div class="buttons" style="justify-content:space-between;align-items:flex-start"><h3>案件情報</h3>${!final?btn('編集',`openCaseModal(${c.mid},${c.id})`):''}</div><dl class="case-info-grid"><dt>会社名</dt><dd>${esc(c.company)}</dd><dt>案件名</dt><dd>${esc(c.title)}</dd><dt>最寄り駅</dt><dd>${esc(c.station||'—')}</dd><dt>担当営業</dt><dd>${esc(state.owners[c.mid]||'未設定')}</dd></dl>${c.notes?`<div class="case-notes">${esc(c.notes)}</div>`:''}</div><div class="case-info-card"><h3>営業進捗</h3><dl class="case-info-grid"><dt>現在ステータス</dt><dd><span class="pill ${c.status==='参画決定'?'green':'purple'}">${esc(c.status)}</span></dd><dt>提案月</dt><dd>${ym(c.month)}</dd><dt>営業対象種別</dt><dd>${esc(data().types[c.mid]||'—')}</dd><dt>未読</dt><dd><div class="infochips"><span class="unread">営業 ${Math.max(0,c.chat.length-(c.readSales||0))}</span><span class="unread">エンジニア ${Math.max(0,c.chat.length-(c.readEngineer||0))}</span></div></dd></dl>${role==='sales'?`<div class="field" style="margin-top:12px"><label>ステータス変更</label><select ${final?'disabled':''} onchange="changeStatus(${c.id},this.value)">${statusOpts(c.status)}</select></div>`:''}${statusButtons}${c.status==='参画決定'&&!contractComplete(c)?`<div class="warncontract">参画決定です。契約情報が未入力のため、入力してください。 ${btn('契約情報を入力',"caseTab='contract';render()")}</div>`:''}</div></div>${c.status==='待機'||c.status==='参画決定'?'<div class="snapshot">この社員の今月の営業はクローズ扱いです。月次データは確定するまで編集できます。</div>':''}<div class="casetabs"><button class="casetab ${caseTab==='chat'?'active':''}" onclick="caseTab='chat';render()">チャット ${unread?`<span class="unread">${unread}</span>`:''}</button><button class="casetab ${caseTab==='contract'?'active':''}" onclick="caseTab='contract';render()">契約情報</button></div>${caseTab==='chat'?`<div class="role-toggle"><span class="tiny textmuted">表示・発言する側（モック）</span><button class="${role==='sales'?'active':''}" onclick="setRole('sales')">営業側 ${Math.max(0,c.chat.length-(c.readSales||0))?`<span class="unread">${Math.max(0,c.chat.length-(c.readSales||0))}</span>`:''}</button><button class="${role==='engineer'?'active':''}" onclick="setRole('engineer')">エンジニア側 ${Math.max(0,c.chat.length-(c.readEngineer||0))?`<span class="unread">${Math.max(0,c.chat.length-(c.readEngineer||0))}</span>`:''}</button></div><div class="chat-shell"><div class="chat-header"><div><h3>案件チャット</h3><div class="chat-sub">ステータス変更も履歴として残ります。どの進捗でどの会話をしたか追える構成です。</div></div><div class="infochips"><span class="pill">${esc(c.status)}</span>${unread?`<span class="unread">未読 ${unread}</span>`:''}</div></div><div class="chat-stream" id="chatHistory">${c.chat.map(x=>`<div class="message ${x.system?'system':x.role===role?'me':'them'}"><div class="meta">${x.system?'履歴':(x.role==='engineer'?m.name:'担当営業')}</div><div class="body">${esc(x.text)}${x.attachment?`<div class="attached-file" onclick="downloadChatAttachment('${esc(x.attachment.key)}')" role="button" tabindex="0">📎 ${esc(x.attachment.name)} <small>(${Math.round(x.attachment.size/102 c.id})`,'primary')}</div>`:''}</div>`}</div></aside>`};

const templates=(role==='sales'?['面談候補日時','入場確認']:['面談希望日時','面談の感想']).map(t=>`<button class="tinyaction" onclick="insertTemplate('${t}')">${t}</button>`).join('');
const composer=!final?`<div class="chat-compose"><div class="chat-textarea-wrap"><textarea id="message" onkeydown="chatKeydown(event,${c.id})" placeholder="メッセージを入力（Enterで送信）"></textarea><button title="送信" aria-label="送信" class="send-plane" onclick="sendChat(${c.id})">➤</button></div><div class="compose-bar"><div class="template-row">${templates}</div><div class="attachment-picker"><label class="attach-label" for="chatAttachment">📎 添付 <span class="tiny textmuted">10MBまで</span></label><input id="chatAttachment" type="file" onchange="attachCaseFile(${c.id},this)"></div></div></div>`:'';
const contract=`<div class="infobox"><h3>契約情報</h3><div class="formgrid"><div class="field"><label>契約開始年月日</label><input type="date" id="ct_start" value="${esc(c.contract.start)}" ${final||role==='engineer'?'disabled':''}></div><div class="field"><label>契約終了年月日</label><input type="date" id="ct_end" value="${esc(c.contract.end)}" ${final||role==='engineer'?'disabled':''}></div><div class="field"><label>入場予定年月日</label><input type="date" id="ct_entry" value="${esc(c.contract.entry)}" ${final||role==='engineer'?'disabled':''}></div><div class="field"><label>単価（円/月）</label><input type="number" id="ct_rate" value="${esc(c.contract.rate)}" ${final||role==='engineer'?'disabled':''}></div></div>${!final&&role==='sales'?`<div class="actions">${btn('契約情報を保存',`saveContract(${c.id})`,'primary')}</div>`:''}</div>`;
return `<aside class="drawer chatdrawer"><div class="drawerhead"><div><button class="link tiny" onclick="openMember(${m.id},'cases')">← ${esc(m.name)}の案件一覧</button><h2>${esc(c.title)}</h2><div class="tiny textmuted">${ym(month)} / 社員番号 ${empNo(m)}</div></div>${btn('×','closeDrawer()')}</div><div class="drawerbody">${compact}${c.status==='参画決定'&&!contractComplete(c)?`<div class="warncontract">契約情報が未入力です。${btn('契約情報を入力',"caseTab='contract';render()")}</div>`:''}<div class="case-tabline"><div class="casetabs"><button class="casetab ${caseTab==='chat'?'active':''}" onclick="caseTab='chat';render()">チャット ${unread?`<span class="unread">${unread}</span>`:''}</button><button class="casetab ${caseTab==='contract'?'active':''}" onclick="caseTab='contract';render()">契約情報</button></div>${roleButtons}</div>${caseTab==='chat'?`<div class="chat-shell"><div class="chat-header">${action}</div>${history}${composer}</div>`:contract}</div></aside>`;
};

window.formatChatDate=function(value){const raw=String(value||'');const d=raw.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2})(?:[ T](\d{1,2}:\d{2}))?/);return d?(d[1]+' '+(d[2]||'').trim()).trim():raw.replace(/(\d{1,2}:\d{2}):\d{2}/g,'$1')};
window.empRows=function(ms){return `<table><thead><tr><th><input type="checkbox" onchange="toggleAll(this.checked)" aria-label="全社員を選択"></th><th>社員番号</th><th>エンジニア</th><th>所属・スキル</th><th>担当営業</th><th>現契約先</th><th>登録済み月</th></tr></thead><tbody>${ms.map(m=>{const months=Object.entries(state.months).filter(([x,d])=>!!d.types[m.id]).map(([x])=>ym(x));return `<tr class="clickrow" onclick="openMember(${m.id})"><td onclick="event.stopPropagation()"><input type="checkbox" data-emp-id="${m.id}" ${selected.has(m.id)?'checked':''} onchange="toggleSelect(${m.id},this.checked)"></td><td class="mono">${empNo(m)}</td><td><div class="rowstack"><span class="employee-name">${esc(m.name)}</span><span class="tiny textmuted">${esc(m.skill)} / ${esc(m.exp)} / ${esc(m.join)}入社</span></div></td><td>${esc(m.team)}<div class="tiny textmuted">${esc(m.skill)}</div></td><td>${esc(ownerOf(m.id))}</td><td>${esc(m.current.company)}</td><td class="tiny">${months.join(' / ')||'—'}</td></tr>`}).join('')}</tbody></table>`};
window.filterEmployees=function(q){const team=$('#empteam')?.value||'';const owner=$('#empowner')?.value||'';const val=(q||'').toLowerCase();$('#empRows').innerHTML=empRows(members.filter(m=>(!team||m.team===team)&&(!owner||ownerOf(m.id)===owner)&&(!val||(m.name+m.team+m.skill+empNo(m)+ownerOf(m.id)+(m.current.company||'')).toLowerCase().includes(val))))};
const beforeStaffPage=window.employeePage;
window.employeePage=function(){let html=beforeStaffPage();const filter=`<select id="empowner" aria-label="担当営業で絞り込み" onchange="filterEmployees($('#empquery').value)"><option value="">全担当営業</option>${OWNERS.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;html=html.replace('<select id="empteam"',filter+'<select id="empteam"');return html};
render();
})();
